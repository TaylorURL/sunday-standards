- id: UXF-15
  title: Toasts Auto-Dismiss And Do Not Steal Focus
  ask: 3-5 seconds, aria-live polite, focus stays where the user left it.
  probe: false
  when: toast
- id: UXF-16
  title: Long Forms Autosave
  ask: A long form keeps a draft so an accidental dismissal does not cost the work, and a sheet with unsaved
    changes confirms before closing.
  probe: false
  when: form
- id: UXF-17
  title: Complexity Is Revealed Progressively
  ask: Advanced options unfold rather than greeting the user all at once.
  probe: false
  when: form
  severity: advisory
- id: UXF-18
  title: Related Fields Are Grouped
  ask: fieldset and legend, or a clear visual grouping, for fields that belong together.
  probe: false
  when: form
- id: UXF-19
  title: Read-Only Differs From Disabled
  ask: Read-only reads as information; disabled reads as unavailable. They do not look the same.
  probe: false
  when: form
- id: UXF-20
  title: Mobile Inputs Are At Least 44px Tall
  ask: Input height meets the touch target floor, and matches the height of adjacent buttons.
  probe: false
  when: form
  severity: blocker
- id: UXF-21
  title: Multi-Step Flows Show Progress And Go Back
  ask: A step indicator, and backward navigation that keeps what was entered.
  probe: false
  when: form
- id: UXF-22
  title: Timeouts Say So And Offer Retry
  ask: A request that times out reports it and offers the retry, rather than spinning.
  probe: false
  when: fetch
  severity: blocker
- id: UXF-23
  title: Autofill Does Not Repaint The Field
  ask: A browser-autofilled input paints its own background — the yellow in Chrome and Safari, a blue
    in some builds — straight over the field's surface token, and it survives a plain background-color
    rule. Untreated, every returning visitor sees a form that does not match the page, and in dark mode
    the autofilled text goes near-invisible on it. Override it in all three themes.
  probe: true
  kinds:
  - web-ui
  - component
  when: form
  severity: blocker
  fix: 'Cover the paint with an inset shadow and set the text colour explicitly: input:-webkit-autofill
    { box-shadow: inset 0 0 0 100px var(--surface); -webkit-text-fill-color: var(--ink); caret-color:
    var(--ink); transition: background-color 0s 600000s; } and repeat it for :hover, :focus, and :active.'
  source: references/code/shadcn-theming.md#autofilled-fields
- id: UXV-01
  title: Current Location Is Visible In The Nav
  ask: The active destination is marked by colour, weight, or an indicator - never left to the user to
    work out.
  probe: false
  when: nav
  severity: blocker
- id: UXV-02
  title: Navigation Stays In The Same Place
  ask: Placement does not change between page types.
  probe: false
  when: nav
