- id: UXV-11
  title: Overflow Menu Rather Than Cramming
  ask: Actions beyond the available space go into an overflow menu.
  probe: false
  when: nav
- id: UXV-12
  title: Large Screens Get A Sidebar
  ask: At 1024px and up, a sidebar; below, bottom or top navigation.
  probe: false
  when: nav
  severity: advisory
- id: UXV-13
  title: Destructive Items Sit Apart In Menus
  ask: Delete account and logout are separated from ordinary navigation, visually and spatially.
  probe: false
  when: nav
  severity: blocker
- id: UXV-14
  title: Unavailable Destinations Explain Themselves
  ask: A destination the user cannot reach says why rather than vanishing.
  probe: false
  when: nav
- id: UXV-15
  title: Core Navigation Stays Reachable
  ask: Navigation is not hidden entirely inside sub-flows.
  probe: false
  when: nav
- id: UXV-16
  title: A New Page Opens At The Top
  ask: 'Navigating to a new page puts the reader at the top of it. Client-side routing keeps the scroll
    position by default, so arriving at a page already scrolled halfway down is the norm unless something
    resets it - and the reader has no idea they are looking at the middle of something. Going back is
    the exception: that restores the position it was left at.'
  probe: true
  when: router
  severity: blocker
  fix: 'Scroll to the top on pathname change - ScrollRestoration in React Router, or a useEffect on the
    pathname calling window.scrollTo({ top: 0 }) - while leaving back and forward to restore their own
    positions.'
- id: UXD-01
  title: Chart Type Matches The Data
  ask: Trend to line, comparison to bar, proportion to pie or donut - and no pie past five categories.
  probe: false
  when: chart
  severity: blocker
- id: UXD-02
  title: Chart Colours Are Colourblind-Safe
  ask: No red/green-only pairing, and colour is supplemented by pattern, texture, or shape.
  probe: false
  when: chart
  severity: blocker
- id: UXD-03
  title: A Table Alternative Exists
  ask: The data is available as a table or text summary, since a chart alone is unreadable to a screen
    reader.
  probe: false
  when: chart
  severity: blocker
- id: UXD-04
  title: Legend Is Visible And Near The Chart
  ask: Not detached below a scroll fold. Where series can be toggled, the legend does it.
  probe: false
  when: chart
- id: UXD-05
  title: Values Are Reachable Without Hover
  ask: Tooltips work on tap, and their content is keyboard-reachable. Small datasets label directly.
  probe: false
  when: chart
  severity: blocker
- id: UXD-06
  title: Axes Are Labelled And Readable
  ask: Units named, ticks not cramped, labels not rotated into illegibility on mobile, time granularity
