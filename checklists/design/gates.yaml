- id: UXV-06
  title: Every Key Screen Has A URL
  ask: Deep-linkable and shareable; no state that exists only after a click path.
  probe: false
  when: router
- id: UXV-07
  title: Modals Are Not Navigation
  ask: A modal is a detour, not a step in the primary path.
  probe: false
  when: modal
- id: UXV-08
  title: Modals Have A Clear Dismiss
  ask: A visible close, Escape on desktop, swipe-down on mobile.
  probe: false
  when: modal
  severity: blocker
- id: UXV-09
  title: Search Is Reachable And Helpful
  ask: Search sits in the top bar or a tab, and offers recent or suggested queries.
  probe: false
  when: search
- id: UXV-10
  title: Breadcrumbs Past Three Levels
  ask: Hierarchies three or more levels deep show where the user is.
  probe: false
  when: nav
