- id: PRC-01
  title: Run Opened Before Any Work
  ask: A design run exists and names its kind and targets before the first file is written. Opening it
    after the fact means the checklist was read against finished work rather than driving it.
  probe: true
  kinds:
  - '*'
  when: always
  severity: blocker
  fix: design-pass.py start --kind <kind> --target <path>
  source: checklist/README.md
- id: PRC-08
  title: Scope Is The Deliverable, Not The Request
  ask: The run covers everything the reader will see, not only the files the prompt named. A request to
    change one button still answers for the page that button sits on. Narrowing the targets to the wording
    of the ask is how a full checklist turns into a short one without anyone deciding to skip anything.
  probe: true
  kinds:
  - '*'
  when: always
  severity: blocker
  fix: 'Widen the run: design-pass.py scan --target <the whole deliverable>. If a file genuinely belongs
    to something else, say which.'
  source: checklist/README.md
- id: PRC-02
  title: Existing Project Read First
  ask: 'Before designing anything, read what is already there: token file, theme definitions, brand assets,
    and at least two sibling components or pages. Name what you found and what you inherited from it.
    A deliverable that ignores the surrounding system is a generic template.'
  probe: false
  kinds:
  - '*'
  when: always
  severity: blocker
  fix: Read the project's tokens/theme/siblings, then resolve with the file paths as evidence.
  source: SKILL.md#five-principles-across-all-domains (1)
- id: PRC-03
  title: Copy Held To avoid-ai-writing
  ask: Every word a person reads in this deliverable — headline, label, caption, empty state, tooltip,
    error, alt text, speaker note — goes through the avoid-ai-writing skill, invoked via the Skill tool,
    applied from the loaded skill rather than from memory.
  probe: true
  kinds:
  - '*'
  when: copy
  severity: blocker
  fix: Invoke avoid-ai-writing, apply it, then run $(sunday tool writing-pass.py) check on the
    files carrying copy.
  source: SKILL.md#five-principles-across-all-domains (4)
- id: PRC-04
  title: No Context-Derived Copy
  ask: 'No user-facing string exists because of the conversation that produced it. The test: would this
    sentence be here if the product had always been this way? Copy that answers a question, justifies
    a scoping decision, apologises for what a page is not, or narrates what changed fails.'
  probe: false
  kinds:
  - '*'
  when: copy
  severity: blocker
  fix: Rewrite the string to state what the thing is, with no memory of being built.
  source: references/intelligence.md#operating-principles
- id: PRC-05
  title: Rendered Output Verified
  ask: Anything that renders is opened and looked at before it is called done — page in the browser pane,
    image at full size, deck at presentation size. Console and network are read for errors. Reading the
    source is not verification.
  probe: false
  kinds:
  - '*'
  when: renderable
  severity: blocker
  fix: Open the deliverable, screenshot it, read the console, then resolve with what you saw.
  source: SKILL.md#delivery
- id: PRC-06
  title: Every Applicable Gate Resolved
  ask: Each gate in the run is pass, fixed, or n/a with a stated reason. No gate is left silent. N/A carries
    the condition that made it inapplicable.
  probe: true
  kinds:
  - '*'
  when: always
  severity: blocker
  fix: design-pass.py status, then resolve what is left.
  source: checklist/README.md
- id: UNI-01
  title: 'Three Themes: Dark, Light, Gray'
  ask: Every colour, border, shadow, and surface reads correctly in dark, light, AND gray. All three are
    defined and all three are looked at. A colour that only works in one theme is a defect, not a preference.
  probe: true
  kinds:
  - web-ui
  - component
  - tokens
  - slides
  when: css
  severity: blocker
  fix: Add the gray theme token block alongside dark and light, and re-check every surface in it.
  source: SKILL.md#five-principles-across-all-domains (2)
- id: UNI-02
  title: No Hardcoded Colour Outside The Token Block
  ask: No hex, rgb(), hsl(), or oklch() literal appears outside :root / [data-theme]. Every colour in
    markup and components references a named token. A literal is a colour that breaks in one of the three
    themes.
  probe: true
  kinds:
  - web-ui
  - component
  - tokens
  - slides
  when: css
  severity: blocker
  fix: Lift the value into the token block as a named variable, then reference var(--name).
  source: SKILL.md#five-principles-across-all-domains (2); slop gate 48
- id: UNI-03
  title: UI Labels Are Title Case
  ask: Menu items, dropdown entries, buttons, tabs, and column headings are Title Case — 'Plugin Library',
    'Join Our Discord', 'Get in Touch'; short prepositions and articles stay lowercase. Sentence case
    on a control label is a defect. Sentences, descriptions, blurbs, helper text, and prose headlines
    stay sentence case.
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  - banner
  - social
  - email
  when: copy
  severity: blocker
  fix: Retitle the label. Check every control label in the deliverable, including ones you did not write.
  source: SKILL.md#five-principles-across-all-domains (5); references/intelligence.md
- id: UNI-04
  title: No Emojis Anywhere
  ask: No emoji in the deliverable, its copy, its code, its comments, or its filenames. Not as an icon,
    not as a bullet, not as decoration.
  probe: true
  kinds:
  - '*'
  when: always
  severity: blocker
  fix: Replace with an SVG icon from the page's single icon library, or drop it and lead with typography.
  source: references/intelligence.md#operating-principles; slop gate 30b
- id: UNI-05
  title: Behaviour Preserved On Redesign
  ask: When redesigning existing code, only presentation changes. Routes, handlers, data contracts, side
    effects, and component ownership stay identical. State the files touched before touching them; deletions
    need explicit confirmation.
  probe: false
  kinds:
  - web-ui
  - component
  when: redesign
  severity: blocker
  fix: Diff the behaviour surface; revert anything that is not presentation.
  source: SKILL.md#five-principles-across-all-domains (3); implementation safety rail
- id: UNI-06
  title: Changed Only What Was Asked
  ask: The deliverable changes what the user asked for and nothing else. Nothing was swapped in to replace
    something they asked to have removed. Improvements they did not request are offered in a sentence
    at the end, not shipped.
  probe: false
  kinds:
  - '*'
  when: always
  severity: blocker
  fix: Revert the unrequested change and put it in the closing note instead.
  source: references/intelligence.md#operating-principles
- id: UNI-07
  title: Semantic Tokens, Not Ad-Hoc Values
  ask: 'Spacing, radius, shadow, z-index, and type sizes come from the named scale. Arbitrary values (padding:
    17px, z-index: 9999, a one-off shadow) are tells.'
  probe: true
  kinds:
  - web-ui
  - component
  - tokens
  - slides
  when: css
  severity: required
  fix: Round to the nearest step on the 4px scale, or add the step to the scale if it is genuinely missing.
  source: references/system/_overview.md; slop gate 24
- id: UNI-08
  title: Accessible Contrast In All Three Themes
  ask: 'Body text clears 4.5:1 against its computed background; large text, icons, and focus rings clear
    3:1. Checked per theme, not inferred from one. The usual misses: text in a card that switched surface,
    muted text on a tinted surface, a focus ring that clears the element but not the page.'
  probe: false
  kinds:
  - web-ui
  - component
  - slides
  - banner
  - social
  - email
  when: css
  severity: blocker
  fix: Pair each colour declaration with its effective background and measure. Fix the failing pair, then
    re-check the other two themes.
  source: references/intelligence.md#1-accessibility; slop gates 40, 41
- id: UNI-09
  title: One Icon Family, Vector Only
  ask: One icon library across the deliverable (Lucide, Phosphor, or Heroicons — not two), consistent
    stroke width, consistent size tokens, filled and outline never mixed at the same hierarchy level.
    SVG, never raster, never emoji.
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  - banner
  - social
  when: icons
  severity: required
  fix: Pick one library and convert the strays, or hand-build the odd one out as SVG in the same visual
    language.
  source: references/intelligence.md#icons--visual-elements; slop gate 30a
- id: UNI-10
  title: Brand Assets Used Correctly
  ask: The real logo file, at an approved variant for its background, with its clear space and minimum
    size respected, unmodified in colour or proportion. No guessed logo paths, no recolouring.
  probe: false
  kinds:
  - '*'
  when: brand_asset
  severity: blocker
  fix: Point at the real asset in the brand directory and restore its clear space.
  source: references/brand/logo-usage-rules.md; approval-checklist
- id: UNI-11
  title: The Logo And Favicon Carry No Background Of Their Own
  ask: 'The mark and the favicon the site ships are transparent: a PNG or WebP with a real alpha channel
    and non-opaque corners, an SVG with no full-bleed rect and no background in its style, or an icon
    whose largest image carries alpha. A JPEG logo is wrong by format, having no alpha at all. A mark
    with a baked-in plate sits in a filled rectangle on every surface whose colour is not the one baked
    into it, which is every dark theme the site has, and a favicon with one sits in a plate on every tab
    strip that is not that colour. apple-touch-icon is the one exception and is left out: iOS composites
    it onto its own ground and renders a transparent one black.'
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  - banner
  - social
  - brand
  - email
  when: always
  severity: blocker
  fix: Re-export the mark with a transparent ground, or strip the background rect from the SVG. AST-01
    covers the same thing for a run that is producing the logo; this one covers a run that is only using
    it.
  source: references/logo-design.md
- id: REF-01
  title: Display Type Tightens As It Grows
  ask: Type at 2rem/32px and above carries negative tracking, in the -0.01em to -0.03em band. Linear runs
    -0.022em from 2rem up, Stripe -0.01em to -0.02em on heading tokens, Apple -0.022em to -0.01em across
    its headline classes. Display type left at the default tracking reads loose next to any of them.
  probe: true
  kinds:
  - web-ui
  - component
  - tokens
  - slides
  when: css
  fix: Give every display step a negative letter-spacing between -0.01em and -0.03em, tightening as the
    size grows.
  source: references/reference-sites.md#display-tracking
- id: REF-02
  title: Display Leading Compresses As Size Grows
  ask: Display line-height sits between 1.0 and 1.25 while body holds 1.5-1.75; the two never share a
    value. Linear steps from 1.4 down to 1.0 across its title ramp, Stripe's heroes sit at 1.05-1.12,
    Apple's headlines at 1.05-1.125. One line-height applied to every size is a defect, not a simplification.
  probe: true
  kinds:
  - web-ui
  - component
  - tokens
  - slides
  when: css
  fix: Give display steps their own line-height in the 1.0-1.25 band, tightening as the size grows, and
    leave body at 1.5-1.75.
  source: references/reference-sites.md#display-leading
- id: REF-03
  title: Every Type Step Declares All Four
  ask: A named type step defines size, line-height, letter-spacing, and weight together, the way Linear's
    --title-N-* quartet and Stripe's --hds-font-*-size/lineHeight/letterSpacing/weight do. Display weight
    is a per-step decision - Stripe's hero is 300, Apple's headlines 600, Linear's titles 590 - never
    the browser's default bold.
  probe: true
  kinds:
  - web-ui
  - component
  - tokens
  when: tokens
  fix: Extend each type step's tokens to carry line-height, letter-spacing, and weight alongside the size.
  source: references/reference-sites.md#type-steps
- id: REF-04
  title: Blurred Chrome Carries Its Fallbacks
  ask: 'A translucent blurred surface ships the -webkit-backdrop-filter prefix beside the unprefixed property,
    and its surface colour holds alpha .8 or higher so the bar stays legible where the blur is unsupported.
    Apple pairs saturate(180%) with blur(20px) so colour survives the blur; Linear''s header is #0b0b0bcc
    behind blur(20px). All three ship the prefix.'
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  fix: Add -webkit-backdrop-filter beside every backdrop-filter, and raise the surface alpha until the
    bar reads without the blur.
  source: references/reference-sites.md#translucent-chrome
- id: REF-05
  title: Hairlines Are Ink At Low Alpha
  ask: 'Separators and 1px borders are the theme''s ink at 5-25% alpha - Linear''s #ffffff14 and #00000014,
    Apple''s rgba(0,0,0,.08) through .16 - not a picked opaque grey. An alpha hairline composites correctly
    over every surface it crosses, which is what lets one token serve every card, panel, and theme.'
  probe: true
  kinds:
  - web-ui
  - component
  - tokens
  when: css
  fix: Define the hairline as the theme's ink colour at 5-25% alpha in the token block and reference it
    from every separator.
  source: references/reference-sites.md#hairlines
- id: REF-06
  title: Headlines Break On Purpose
  ask: 'Headings get text-wrap: balance and supporting prose gets text-wrap: pretty, so no headline strands
    one word on its own line. Stripe balances its headings and sets pretty on 23 prose rules; Linear does
    the same; Apple hand-places break spans per breakpoint, which is the manual form of the same decision.'
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: hero
  fix: 'Set text-wrap: balance on headings and text-wrap: pretty on paragraphs at the base layer.'
  source: references/reference-sites.md#headline-breaks
- id: REF-07
  title: Font Rendering Set At The Root
  ask: '-webkit-font-smoothing: antialiased and -moz-osx-font-smoothing: grayscale are declared once at
    the root, as all three sites do, so weights render as drawn rather than a step heavier on macOS. The
    ramp''s weights are chosen with that rendering in place.'
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: font
  fix: 'Declare -webkit-font-smoothing: antialiased and -moz-osx-font-smoothing: grayscale on the root
    element.'
  source: references/reference-sites.md#font-rendering
- id: REF-08
  title: The Container Width Is A Token
  ask: 'The content max-width is one named value referenced everywhere - Linear''s --page-max-width: 1024px,
    Stripe''s --hds-space-layout-content-maxWidth: 1264px - never a number retyped per section. UXL-06
    requires one width; this requires it have one definition, so changing it is one edit.'
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  fix: Define the container width once as a token and reference it from every section that centres content.
  source: references/reference-sites.md#container-token
- id: REF-09
  title: Logo Walls Are One Ink
  ask: 'Third-party logo strips render monochrome - a grayscale filter or single-colour SVGs - so the
    row reads as one quiet band of proof rather than competing brand colours. All three sites ship grayscale
    in their customer and partner logo sections. The strip also carries logos and nothing else: no industry
    or category label under each mark, which TST-47 counts.'
  probe: true
  kinds:
  - web-ui
  when: html
  fix: 'Apply filter: grayscale(1) to the strip, or serve the logos as single-colour SVGs inheriting currentColor,
    and delete any category label sitting under a mark.'
  source: references/reference-sites.md#logo-walls
- id: NAV-01
  title: The Bar Has Two States And A Transition Between Them
  ask: 'A bar over a hero may start transparent or scrim-backed, but the moment content scrolls beneath
    it it carries the opaque or blurred surface HDR-02 requires, and the change is a transitioned background
    swap near 200ms, never a snap. Shield AI moves from gradient scrim to solid #050506 with transition:
    background-color ease-out 0.2s; Saronic holds a sticky bar on its body surface token and goes transparent
    only in its hero state; Apple keeps one alpha-plus-blur surface at all times, the one-state form that
    needs no swap.'
  probe: true
  fix: Give the bar an explicit scrolled state that applies the opaque surface, and transition background-color
    between the two.
  source: references/navigation-sites.md#two-surface-states
- id: NAV-02
  title: Nav Motion Is Its Own Token Family
  ask: 'A bar with a real disclosure panel - a flyout, popover, mega-menu, or full-nav dropdown - names
    its timings as tokens referenced from every nav transition, in the 240-300ms band with the easing
    declared beside them, and zeros them under reduced motion at the token so one media query stills the
    whole bar. Ramp ships --nav-desktop-popup-duration: .3s, --nav-mobile-duration: .24s, and --nav-hamburger-duration:
    .25s beside --nav-mobile-easing; Stripe ships --navigation-duration: 240ms, -slow: 300ms, and hamburger
    0.25s, all set to 0s under prefers-reduced-motion. Both ship the identical curve cubic-bezier(.45,
    .05, .55, .95). POL-04 and POL-06 gate easing tokens and duration caps in general; this requires the
    nav family exist by name once the bar owns a panel worth naming.'
  probe: true
  severity: advisory
  fix: Define the nav duration and easing tokens once and reference them from every transition the bar
    owns.
  source: references/navigation-sites.md#nav-motion-tokens
- id: NAV-03
  title: A Trigger That Opens A Panel Is A Disclosure Button
  ask: A top-level item that opens a panel rather than navigating is a button carrying aria-expanded that
    mirrors the panel's visibility, never an anchor with a dead href; the items that navigate stay anchors.
    Ramp renders its five group triggers as buttons with aria-expanded beside seven true links, and Stripe's
    five and Mercury's four do the same. Escape closes the panel and returns focus to the trigger, as
    FLD-08 requires of every menu.
  probe: true
  severity: blocker
  fix: Swap panel triggers to buttons, mirror the open state onto aria-expanded, and wire Escape to close
    and refocus.
  source: references/navigation-sites.md#disclosure-triggers
- id: NAV-04
  title: Past Six Destinations The Panel Is A Directory
  ask: 'A panel holding more than six destinations groups them under quiet headings, and each item carries
    its name plus a one-line description of where it leads - a column of bare anchors is a sitemap, not
    navigation. Mercury ships the structure server-rendered: 54 destinations grouped under four triggers,
    nineteen with descriptions beneath the label. Stripe''s Products panel groups Payments, Billing, Connect,
    and Issuing under headings; Ramp''s panels group the same way.'
  probe: true
  fix: Group the panel's links under headings and give each destination a one-line description.
  source: references/navigation-sites.md#structured-panels
- id: NAV-05
  title: The Bar Ends In One Loud Action
  ask: At most one filled button closes the bar, with sign-in and everything else sitting as quiet links
    beside it; two competing filled buttons split the one decision the bar is allowed to push. Stripe
    closes with Sign in beside Contact sales, Ramp with Sign in beside Get started, Mercury with Log in
    beside Open Account, Shield AI with a lone Schedule a Demonstration.
  probe: true
  fix: Keep one primary button at the trailing edge and demote the rest of the cluster to quiet links.
  source: references/navigation-sites.md#one-loud-action
- id: NAV-06
  title: Uppercase Micro-Labels Are Tracked Wide
  ask: 'Uppercase at small sizes - eyebrows, nav micro-labels, spec callouts - carries positive letter-spacing
    in the 0.03em to 0.12em band; capitals at default tracking read cramped. Anduril tracks 86 of its
    109 uppercase rules at .03rem, Shield AI''s run .07em to .11em, and the lowercase-first sites barely
    use the transform at all - Stripe once, Apple never - which is the other honest answer: track capitals
    wide, or do not set capitals.'
  probe: true
  when: css
  fix: 'Add positive letter-spacing between 0.03em and 0.12em wherever text-transform: uppercase applies,
    or drop the transform.'
  source: references/navigation-sites.md#tracked-micro-labels
- id: NAV-07
  title: A Bar That Hides Comes Back On The First Upward Scroll
  ask: 'Hide-on-scroll moves the bar away by exactly its own height with a transition, returns it on the
    first upward scroll, and never hides while a panel is open or focus is inside it. Saronic slides its
    64px bar under a data-hidden attribute to top: calc(var(--announcement-bar-height) - var(--height)),
    so the tokens that place the bar are the tokens that remove it.'
  probe: true
  fix: Drive the hidden state from the bar's own height token, return on upward scroll, and suppress hiding
    while the menu is open.
  source: references/navigation-sites.md#hide-on-scroll
- id: NAV-08
  title: The Open Panel And The Bar Are One Surface
  ask: An open panel continues the bar - the same surface token and no seam or gap at the join - and the
    page behind acknowledges it with a scrim, a dim, or a blur. Apple's globalnav drops its own backdrop
    blur the moment the flyout opens because the flyout brings the full-width surface with it. A panel
    floating a visible gap below a bar it does not touch reads as a tooltip, not navigation.
  probe: true
  fix: Share the surface token between bar and panel, remove the gap at the join, and put a scrim over
    the page while open.
  source: references/navigation-sites.md#one-panel-that-travels
- id: NAV-09
  title: Between Triggers The Panel Travels
  ask: 'With a panel open, moving to the next trigger morphs the one panel - position, size, and a content
    crossfade - rather than closing and replaying the open animation, and the diagonal path from trigger
    to panel never closes it. This is the shipped behavior of Stripe''s bar and the first thing its imitations
    drop: the open animation plays once, and travel between siblings does not re-enter it.'
  probe: false
  fix: Keep one panel mounted across triggers, animate its position and size to the active item, and crossfade
    the content.
  source: references/navigation-sites.md#one-panel-that-travels
- id: NAV-10
  title: The Top Level Holds Four To Seven Destinations
  ask: Four to seven top-level items, each labeled in one or two words, with everything else living inside
    panels or in the footer. Stripe holds five named groups, Ramp six, Mercury four beside Pricing, Shield
    AI six, and Saronic collapses to a single Menu button rather than crowd the bar; Apple runs twelve
    only because every label is one word. No measured bar wraps a label.
  probe: true
  fix: Fold overflow destinations into the panels or the footer until the bar holds seven or fewer one-or-two-word
    items.
  source: references/navigation-sites.md#top-level-restraint
- id: NAV-11
  title: The Bar Declares Which Shape It Is
  ask: A stamp at the top of the navigation stylesheet names the archetype the bar is, out of the catalog
    in references/hallmark/references/components. Every other gate measures whether the bar is free of
    defects; this one asks whether its shape was chosen. A bar can pass every other rule in the set and
    still be the shape a generated page reaches for first, and nothing else in the run can tell.
  probe: true
  kinds:
  - web-ui
  when: nav
  severity: blocker
  fix: 'Read the N-archetypes in references/hallmark/references/components, pick the one this brief calls
    for, build it, and stamp it: /* nav: n5-floating-pill */'
  source: references/hallmark/references/components
- id: NAV-12
  title: The Bar Is Not The Shape Every Generated Page Lands On
  ask: 'Wordmark hard-left, a row of text links, one filled call to action at the trailing edge: n1b-saas-three-section
    and n1-wordmark-2-links are where a page goes when nobody decided. Polish does not rescue the shape
    - a blur, a scroll-state swap and a dark ground sit just as happily on the default as on anything
    else, which is why the surface gates pass it.'
  probe: true
  kinds:
  - web-ui
  when: nav
  severity: blocker
  fix: Move to an archetype with a point of view - a floating pill, an edge-aligned minimal, a side rail,
    a masthead, a command bar - or dispute this gate with the reason the default shape is right for this
    brief.
  source: references/hallmark/references/components
- id: NAV-13
  title: The Bar Differs From The Last Page Of Its Kind
  ask: Two landing pages that share a nav archetype are one template wearing two palettes. The choice
    is recorded when a run closes and compared on the next run of the same page kind.
  probe: true
  kinds:
  - web-ui
  fix: Pick a different archetype from the catalog, or dispute this with the reason this brief needs the
    same shape as the last one.
  source: references/hallmark/references/components
- id: FTR-01
  title: The Footer Declares Which Shape It Is
  ask: A stamp names the footer archetype out of the Ft catalog. The four-column link grid with a social
    row and a tiny copyright is what a page produces when the footer was filled in rather than designed,
    and only a declared shape makes the difference visible.
  probe: true
  kinds:
  - web-ui
  when: footer
  severity: blocker
  fix: 'Pick an Ft archetype, build it, and stamp it: /* footer: ft5-statement */'
  source: references/hallmark/references/components
- id: FTR-02
  title: The Footer Is Not The Default Index Grid
  ask: Product, Company, Resources, Legal in four columns under a hairline is the shape to move away from
    unless the page is a genuine docs root or hub.
  probe: true
  kinds:
  - web-ui
  when: footer
  fix: Move to a statement, a mast-headed, a dense-typographic, or an inline-rule footer, or dispute this
    with the reason a link index is right here.
  source: references/hallmark/references/components
- id: NAV-14
  title: The Bar Opens Something
  ask: At least one top-level destination opens a panel, with a trigger carrying aria-expanded or aria-haspopup
    and a real panel body behind it. apple.com puts a full-width panel under every top-level word; anduril.com
    and stripe.com do the same. A flat row of links is a link list, and no amount of blur, scroll-state
    or dark ground turns it into navigation - which is why the surface gates pass a bar that has none.
  probe: true
  kinds:
  - web-ui
  severity: blocker
  fix: 'Give the top-level destinations that have children a disclosure that opens a panel: a trigger
    with aria-expanded and a panel body holding the sections beneath it. NAV-03 then governs the trigger
    and NAV-04 the panel''s shape.'
  source: references/navigation-sites.md#two-surface-states
- id: NAV-15
  title: The Panel Names Its Own Shape
  ask: 'The mega menu declares which catalogue shape it is, stamped as /* panel: <slug> */ beside the
    nav and footer stamps. Without it every panel is built the way the last one was built, which is how
    a row of icon tiles over a one-line summary ends up under every bar on every site: nobody chose it,
    it was simply what the previous file did. The bar archetype does not answer for this. It describes
    the bar''s own shape and says nothing about what opens beneath it.'
  probe: true
  kinds:
  - web-ui
  severity: required
  fix: 'Pick a panel shape and stamp it: mm1-icon-row-list, mm2-two-column-split, mm3-grouped-columns,
    mm4-full-bleed-canvas, mm5-preview-on-hover, mm6-inline-expand-row. Build what the entry describes
    rather than stamping the name over what is already there.'
  source: references/hallmark/references/components
- id: NAV-16
  title: The Panel Is Not The Last One Again
  ask: The panel shape differs from the one the last run of this page kind used. Twelve sites whose bars
    each picked a different archetype still read as one template when every bar opens the same panel,
    because the panel is the part a visitor actually reads. Rotating the bar and repeating the panel is
    the shape of that failure.
  probe: true
  kinds:
  - web-ui
  severity: required
  fix: Take a different entry from the panel catalogue and build it. Dispute this only where the repeat
    is the point, and say which brief makes it so.
  source: references/hallmark/references/components
- id: NAV-17
  title: The Scrolled Bar Is Still Opaque
  ask: 'A bar that changes on scroll paints in two states and only one of them gets looked at. The scrolled
    state is where it fails: a ground kept translucent because a backdrop filter was doing the work, and
    a backdrop filter on the outer bar wrapping the one on the inner pill. A zero blur is still a backdrop
    filter, so blur(0) on the outer nests a second layer around the inner one, and WebKit composites the
    inner against the outer rather than the page: the page''s own headings paint over the bar. It renders
    correctly in Chromium, which is why it ships.'
  probe: true
  kinds:
  - web-ui
  severity: blocker
  fix: 'Set backdrop-filter: none on the outer bar in its scrolled state rather than blur(0), so nothing
    nests, and give the detached bar an opaque ground rather than a wash. Detached from the edge it reads
    as an object, and nothing behind it can show through where the blur is dropped.'
- id: NAV-18
  title: Nothing Hangs Out Of A Rounded Container
  ask: 'A square child against a rounded container''s corner sits outside the arc unless the row is inset
    by what the radius needs at that height. A pill bar with a 999px radius and no inline padding puts
    its call to action flush with the container edge, and the button''s corners then hang off the end
    of the bar. Nothing in source shows it: the radius is a correct number and the padding is a correct
    number, and only their ratio at the rendered height decides it. For a corner of radius r, a child
    whose edge is dy from the container''s other edge needs r minus the square root of r squared less
    dy squared.'
  probe: true
  kinds:
  - web-ui
  when: css
  severity: blocker
  fix: Inset the container's row by at least what the corner needs, and transition the inset alongside
    the radius where the shape morphs, so the two never disagree mid-animation.
- id: NAV-19
  title: The Open Panel Is A Surface, Not A Filter
  ask: 'A mega-menu panel is opaque. Whatever alpha or blur the bar carries over a hero, the panel behind
    it does not: it covers a page of type with a page of type, and anything showing through puts the two
    on top of each other at exactly the moment a visitor is reading to choose where to go. Stripe''s panel
    is solid #fff over a blurred bar; Apple''s global nav goes opaque the moment a panel opens. A backdrop-filter
    also costs a compositor pass on every scroll frame behind the largest element on the page.'
  probe: true
  when: nav
  severity: blocker
  fix: Give the panel the bar's own solid surface token with no alpha modifier and no backdrop-blur, and
    let its border and shadow do the separating.
  source: references/navigation-sites.md#panel-surface
- id: NAV-20
  title: The Strip Above The Bar Was Decided
  ask: 'A rail above the navigation is not owed by every site, and it is owed by more of them than have
    one. The test is what the bar is carrying that does not belong to it: a phone number, opening hours,
    a second office, a locale or currency switch, a store locator, an order tracker, an account link,
    a parent brand. Where that exists, it goes in a strip above the bar so the bar itself holds destinations
    and one action; where it does not, a rail is a bar of filler and the run says so. Either answer is
    fine. Never having asked is the defect.'
  probe: true
  when: nav
  severity: required
  fix: Lift the utility content into a strip above the bar at the width that has room for it, or record
    what this bar carries that would have gone there and why it is better placed where it is.
  source: references/navigation-sites.md#utility-strip
- id: MOB-01
  title: The Bar Is Reachable Without Scrolling Back Up
  ask: 'Navigation is reachable from wherever the visitor is, not from the top of the document. A bar
    in normal flow leaves a reader three screens down with one way to change pages: scroll all the way
    back. Pin the bar to the top edge (fixed or sticky), or pin the actions to the bottom edge, or both.
    Apple, Stripe and Shopify all keep the bar at the top edge on a phone; the retail pattern keeps a
    bottom rail instead and lets the bar go.'
  probe: true
  when: nav
  severity: blocker
  fix: 'Give the header position: fixed or sticky with top: 0, or pin the page''s primary actions to the
    bottom edge, and reserve the height it takes out of flow.'
- id: MOB-02
  title: The Menu Is Measured Against The Visible Viewport
  ask: A phone's toolbar is inside 100vh and outside 100dvh. A menu capped in vh therefore extends under
    the browser's own controls, and the rows at the bottom of it are unreachable until the visitor scrolls
    the page - which is the thing they opened the menu instead of doing. Every viewport measure on a surface
    a phone sees is dvh or svh, never vh, and a menu that caps its height at a fixed pixel value is guessing
    at a screen it has not measured.
  probe: true
  when: nav
  severity: blocker
  fix: Replace every vh with dvh (or svh where the smallest state is the safe one), and cap the open menu
    at calc(100dvh - <the bar's height>) rather than at a pixel figure.
- id: MOB-03
  title: A Menu Taller Than The Screen Scrolls Inside Itself
  ask: 'A menu with more rows than the screen holds needs its own scroll, and needs it to stop at its
    own edge. Without overflow-y: auto the last rows are simply gone; without overscroll-behavior: contain,
    reaching the end of the list drags the page behind it, so the menu appears to slide off its own bar.'
  probe: true
  when: nav
  severity: required
  fix: 'Put overflow-y: auto and overscroll-behavior: contain on the open menu''s own container, inside
    whatever animates its height.'
- id: MOB-04
  title: Chrome On A Viewport Edge Clears The Device Inset
  ask: A bar pinned to the bottom edge lands under the home indicator on every phone that has one, and
    a bar pinned to the top lands under the notch on a landscape device. The inset the device reserves
    is published as env(safe-area-inset-*), and chrome on an edge reads it - as padding on the bar, so
    the bar's ground still reaches the edge and only its content stands off it.
  probe: true
  when: sticky
  severity: blocker
  fix: 'Add padding-bottom: env(safe-area-inset-bottom, 0px) to the pinned bar, and fold the same env()
    into whatever token reserves its height.'
- id: MOB-05
  title: The Main Action Is Under A Thumb
  ask: 'A page whose primary action is a call, a booking, an order, or an application puts that action
    where a thumb already is: a bar pinned to the bottom edge on small screens, carrying one or two actions
    and nothing else. This is not owed by every site - an editorial page or an app shell has no such action,
    and a rail there is a bar of filler. It is owed by the page that publishes a number and then asks
    a visitor to scroll back to the header to use it.'
  probe: true
  when: nav
  severity: required
  fix: Add a fixed bottom bar below the lg breakpoint carrying the page's one or two real actions, or
    record why this page's primary action is not one a thumb needs from anywhere.
- id: MOB-06
  title: Fixed Chrome Reserves Its Own Height
  ask: 'A bar out of flow takes no height, so the end of the document finishes underneath it - the footer,
    the last field of a form, the attribution line. The height is reserved in flow: a spacer element,
    or padding on the page, sized from the same token the bar reads, so moving one moves both.'
  probe: true
  when: sticky
  severity: required
  fix: Declare the bar's height as a token, render a spacer of that height at the end of the page (or
    pad the page by it), and have both read the token.
- id: MOB-07
  title: The Small-Screen Menu Reaches What The Panel Reaches
  ask: A bar whose desktop panels reach the sections inside a page, and whose phone menu reaches only
    the pages, is two different sites. Whatever a panel promotes - a section anchor, a featured destination,
    the phone number - the small-screen menu carries too, in the same order and under the same words.
    The shape differs; the reachable set does not.
  probe: false
  when: panel
  severity: required
  fix: Render the small-screen menu from the same nav data the panels read, nesting each page's sections
    under it, so a destination cannot exist on one and not the other.
- id: MOB-10
  title: The Bar Was Still There A Screen Down
  ask: 'Measured rather than asserted: at a phone width, scrolled as far as the page goes or 2000px, either
    the bar is still on screen or a bar pinned to the bottom edge is.'
  probe: true
  when: nav
  severity: required
  fix: Pin the bar or the actions to a viewport edge; MOB-01 says how.
- id: MOB-11
  title: Every Row Of The Open Menu Can Be Reached
  ask: 'Measured with the menu actually open at a phone width: no row of it falls below the visible viewport
    unless the menu scrolls inside itself to reach that row. A row below the fold with no scroll is a
    destination that does not exist on a phone.'
  probe: true
  when: nav
  severity: blocker
  fix: 'Cap the menu against the visible viewport and give it its own scroll: MOB-02 and MOB-03.'
- id: MOB-12
  title: Pinned Chrome Does Not Cover The End Of The Page
  ask: 'Measured at the bottom of the document: nothing pinned to the viewport''s bottom edge overlaps
    the last of what the page laid out.'
  probe: true
  when: sticky
  severity: required
  fix: 'Reserve the pinned bar''s height in flow: MOB-06.'
- id: MOB-13
  title: The Page Does Not Scroll Sideways On A Phone
  ask: 'Measured: the document''s scroll width is the viewport''s width. A page that scrolls sideways
    on a phone reads as broken before a visitor has read a word of it, and the cause is almost always
    one element - a wide table, an unwrapped row of chips, a negative margin, a fixed pixel width.'
  probe: true
  severity: blocker
  fix: The capture names the elements that overhang. Wrap, scroll them in their own container, or drop
    the fixed width.
- id: MOB-14
  title: Every Control Is A Target A Thumb Can Hit
  ask: 'Measured at a phone width, including inside the open menu: every link, button, and field is at
    least 44px on both axes. A link inside a sentence is read rather than aimed at and is not counted.'
  probe: true
  when: interactive
  severity: required
  fix: Give the control the project's control-height token, or pad it until the box reaches 44px; do not
    enlarge the label to get there.
- id: MOB-15
  title: The Phone Capture Was Taken
  ask: Every measured gate above answers to one reading, taken at 390x844 with the menu opened. A run
    that never took it has answered none of them, and the four unread gates are the four that only a phone
    decides.
  probe: true
  severity: required
  fix: Render the page at 390x844, run scripts/code/mobile-probe.js, await mobileProbe.scan(), and record
    it with design-pass.py mobile-probe --file <capture.json>.
- id: PROD-01
  title: Real 404 On Unknown Paths
  ask: A GET to a path that does not exist returns HTTP 404, not the SPA shell with 200. Stripe, Apple,
    Linear, Vercel, and Anthropic all return a real 404 status; a client-routed rewrite that maps every
    unknown path to /index.html leaves crawlers, monitors, and typoed shares unable to tell a real page
    from a miss, and search engines index the shell as content.
  probe: false
  severity: blocker
  fix: 'For Vercel or Netlify SPAs, add a not-found route that responds with a 404 status, and remove
    any catch-all rewrite to /index.html that lacks a status. Verify: curl -s -o /dev/null -w ''%{http_code}''
    https://<site>/$(uuidgen) — must be 404.'
  source: site audit 2026-08, spa-catch-all
- id: PROD-02
  title: robots.txt Is A Real File, Not The SPA Shell
  ask: /robots.txt returns text/plain, not text/html. On four audited sites the SPA catch-all swallowed
    the request and returned the app shell instead; a bot expecting text/plain and getting HTML stops
    parsing.
  probe: true
  severity: required
  fix: 'Add public/robots.txt (or app/robots.ts). Verify content-type after deploy: curl -sI https://<site>/robots.txt
    | grep -i content-type — must be text/plain.'
  source: site audit 2026-08, robots-shell
- id: PROD-02B
  title: sitemap.xml Is A Real File, Not The SPA Shell
  ask: /sitemap.xml returns application/xml, not text/html. Every <loc> in it uses the site's production
    origin, not the deployment host. setxfootball.org's sitemap listed eight URLs on a domain that does
    not resolve.
  probe: true
  severity: required
  fix: 'Add public/sitemap.xml (or app/sitemap.ts) whose entries derive from the site''s public origin
    env var. Verify: curl -sI https://<site>/sitemap.xml | grep -i content-type — must be application/xml.'
  source: site audit 2026-08, sitemap-shell
- id: PROD-03
  title: OG And Twitter Card Meta Present
  ask: Every landing page ships og:title, og:description, og:image, og:url, and twitter:card. Without
    them shared links render as a blank card with a hostname — a two-second signal to the reader that
    no one polished this. Four audited sites shipped one or none.
  probe: true
  severity: required
  fix: Add the four meta tags to the head. og:image must be a raster PNG or JPG at 1200x630; SVG is unreliable
    across social platforms.
  source: site audit 2026-08, og-twitter-missing
- id: PROD-04
  title: Canonical URL Points To The Public Origin
  ask: <link rel="canonical">, og:url, twitter:image, and every <loc> in sitemap.xml carry the site's
    production origin, not the deployment host. domebreak.com shipped every one of these pointing at domebreak.vercel.app,
    so Google consolidated signals onto the wrong subdomain and every social share linked to the unbranded
    URL.
  probe: true
  severity: blocker
  fix: Set the site's public origin as an env var (NEXT_PUBLIC_SITE_URL) and derive every canonical, OG
    URL, and sitemap entry from it. Never hardcode the deployment host.
  source: site audit 2026-08, canonical-wrong-host
- id: PROD-05
  title: Apple Touch Icon At Web Root
  ask: <link rel="apple-touch-icon" href="/apple-touch-icon.png"> is declared in the head AND the file
    exists at /apple-touch-icon.png as a 180x180 PNG. iOS fetches the root path directly before parsing
    HTML; a 404 costs the home-screen icon. Three of four audited flagship sites lacked the file at the
    root path.
  probe: true
  severity: required
  fix: 'Add <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"> and drop the 180x180
    PNG at public/apple-touch-icon.png. Verify: curl -sI https://<site>/apple-touch-icon.png — must return
    200 and image/png.'
  source: site audit 2026-08, apple-touch-missing
- id: PROD-06
  title: Privacy And Terms Are Linked And Reachable
  ask: The footer links to /privacy and /terms, both routes return 200, and both render the site's header
    and footer. Six audited sites lacked one or both entirely, including a game distributor that requires
    account signup with no ToS anywhere.
  probe: true
  severity: required
  fix: 'Add both pages as real routes with the site''s normal header and footer. Verify: curl -s -o /dev/null
    -w ''%{http_code}'' https://<site>/privacy — must be 200; view-source must show the site''s nav and
    footer landmarks.'
  source: site audit 2026-08, privacy-terms-missing
- id: PROD-07
  title: Static Shell For The Bots
  ask: The pre-JS HTML body contains the site's H1, nav, and footer landmarks — not an empty <div id="root"></div>
    and not a single line telling the visitor to enable JavaScript. Four audited SPAs rendered only that
    sentence; Stripe, Linear, and Anthropic all serve a static or SSR'd shell that is legible without
    JS.
  probe: true
  severity: required
  fix: Turn on SSR (Next.js), pre-render with vite-plugin-ssr / astro, or hand-write a static shell with
    the H1, nav, and footer inline in index.html.
  source: site audit 2026-08, blank-flash
- id: PROD-08
  title: Footer Names The Entity And The Year Comes From Date
  ask: 'The copyright line names a non-empty legal entity and the year is computed from new Date().getFullYear().
    rootrise shipped ''(c) 2026 . All rights reserved.'' - an unresolved template variable to unauthenticated
    visitors; impressiva and deluxlavello hardcoded 2026 as a string literal that will go stale on 2027-01-01.
    A marketing footer also carries no build string: v1.4.2, Build 0048, and last sync are devtool fixtures,
    held by TST-27.'
  probe: true
  severity: required
  fix: 'Use new Date().getFullYear() for the year and pass a non-empty entity name into the footer component.
    Test the logged-out render: an unauthenticated visitor must see the entity, not an empty span. Strip
    any version or build string from a marketing footer.'
  source: site audit 2026-08, footer-entity-year
- id: PROD-09
  title: No Placeholder Tokens In The Shipped Bundle
  ask: No REPLACE_ME, TODO, FIXME, XXX, lorem ipsum, or example.com appears in HTML or JS served to the
    browser. deluxfit's Instagram and TikTok footer links pointed at https://instagram.com/REPLACE_ME
    in production.
  probe: true
  severity: blocker
  fix: Grep the built bundle before deploy and fail the build on any hit.
  source: site audit 2026-08, placeholder-tokens
- id: PROD-10
  title: No Coming Soon In Production
  ask: No 'coming soon', 'under construction', or 'TBD' in shipped copy. If the feature is not ready,
    do not render its card. deluxfit shipped a 'Coming Soon' feature card live.
  probe: true
  severity: required
  fix: Remove the card, or gate it behind a feature flag that stays false until it is real.
  source: site audit 2026-08, coming-soon
- id: PROD-11
  title: No Dev, Admin, Or Staging Routes In The Public Bundle
  ask: The client bundle does not declare /dev, /admin, /staging, /debug, or /internal routes. deluxfit
    shipped /dev-upload and eight /admin/* routes into the public bundle, all discoverable by reading
    the JS. Admin surfaces belong on a separate deployment, subdomain, or behind an auth-gated route the
    marketing build does not know about.
  probe: true
  severity: blocker
  fix: Move admin routes into a separate app, a separate deployment, or a route group the marketing build
    does not compile. If the route must live in the same repo, exclude it from the production build.
  source: site audit 2026-08, dev-routes-leaked
- id: PROD-12
  title: Title Names The Page And The Brand
  ask: <title> contains a separator (|, —, ·) or a descriptor beyond the brand name — 'Speedway 146 |
    Go-Kart Racing in Baytown, TX', not 'Smyrna Tools'. A one-word title costs the search-result subtitle
    and reads as unfinished.
  probe: true
  severity: required
  fix: Extend the title with a separator and a phrase that names what the page is or does.
  source: site audit 2026-08, single-word-title
- id: PROD-13
  title: No Meta Keywords
  ask: No <meta name="keywords"> in the head. Google stopped honoring it in 2009; Stripe, Apple, Linear,
    Vercel, and Anthropic do not ship one. Shipping one reads as SEO cargo-culting.
  probe: true
  severity: advisory
  fix: Delete the tag. Real SEO lives in the title, description, structured data, and content.
  source: site audit 2026-08, meta-keywords
- id: PROD-14
  title: Custom 404 With The Site's Chrome
  ask: A request to a non-existent path renders a custom 404 page with the site's header, footer, and
    a link home — not the framework default or a bare 'Not Found'. deluxlavello ships one; three others
    render the default Vercel or CRA error page.
  probe: true
  severity: required
  fix: Add app/not-found.tsx (Next) or a NotFound component wired to a catch-all route. It must render
    the site's header, footer, and a link to /.
  source: site audit 2026-08, custom-404
- id: PROD-15
  title: OG Image Is A 1200x630 Raster Share Card
  ask: og:image is a raster PNG or JPG at 1200x630, purpose-built as a share card — not the logo file,
    not an SVG. LinkedIn and Slack do not render SVG previews reliably, and a bare logo strands the reader
    with no context.
  probe: true
  severity: required
  fix: Design a 1200x630 PNG that names the page or product, save it as public/og.png, and reference it
    from og:image and twitter:image.
  source: site audit 2026-08, og-image-quality
- id: PROD-16
  title: TLS Serves The Right Cert
  ask: https://<site> completes the TLS handshake without a SNI mismatch and returns a real body, not
    a domain-parking page. speedway146.com failed TLSV1_ALERT_UNRECOGNIZED_NAME and its A record pointed
    at a Sedo parking IP — the site had effectively been offline for weeks and nobody noticed.
  probe: false
  severity: blocker
  fix: Verify with `openssl s_client -servername <host> -connect <host>:443 </dev/null` and `curl -sI
    https://<host>`. Wire the site into ~/error-reporting so a red uptime shows up in Discord instead
    of getting found by an audit.
  source: site audit 2026-08, tls-parking
- id: PROD-17
  title: GitHub Repo Homepage Points At The Live Site
  ask: The repo's `homepageUrl` on GitHub resolves and matches the actual live site. TaylorURL/baytowngocarts-com
    listed speedway146.com (a dead domain) while the site is at baytowngokarts.com — every tool that walks
    repo metadata probed the wrong host.
  probe: false
  severity: required
  fix: 'gh repo edit <owner>/<repo> --homepage https://<live-url>. Verify: gh repo view <owner>/<repo>
    --json homepageUrl.'
  source: site audit 2026-08, stale-repo-homepage
- id: PROD-18
  title: Form Inputs Have Real Labels
  ask: Every <input>, <select>, and <textarea> has an associated <label for> or aria-label. Placeholder
    text is not a label — it disappears when the user starts typing and fails screen readers. Two audited
    sites used placeholder-only inputs on numeric and search fields. See also FLD-03 which enforces this
    on component libraries.
  probe: true
  severity: required
  fix: Add a visible <label htmlFor="...">Name</label> or aria-label to every input, select, and textarea.
  source: site audit 2026-08, placeholder-labels
- id: PLT-01
  title: The Page Draws Something Of Its Own
  ask: A surface with a subject draws it. Photography shows what a place looked like on one afternoon
    and a library glyph shows a generic shape; neither shows what this business actually moves, builds,
    sells, or repairs. Flat vector plates in the project's own palette do, they weigh a kilobyte, they
    scale to any width, and they are the one visual thing on a site that cannot have come from anywhere
    else. Keep them as files under public/art and reference them, so one plate can serve a menu panel
    and a section without being drawn twice.
  probe: true
  kinds:
  - web-ui
  when: marketing
  severity: required
  fix: Draw three to six plates of the subject on one viewBox and one palette taken from the token block,
    save them under public/art, and render them through a single component.
  source: references/icon-design.md
- id: PLT-02
  title: A Plate Is Imagery For A Block, Not A Mark Per Row
  ask: One plate belongs to a panel, a section, or a card; it does not belong to each link inside one.
    A mark against every menu option stops reading as a drawing and starts reading as a bullet, and every
    row's mark then has to be invented to fill the slot rather than because there was something to draw.
    In a mega-menu the plate sits in the promoted half beside a heading and a sentence, with the destinations
    listed plainly beside it.
  probe: true
  kinds:
  - web-ui
  when: image
  severity: required
  fix: 'Move the plate out of the row loop and into the block that owns it: one per panel or section,
    keyed on the block rather than on a destination.'
  source: references/hallmark/references/components/mm2-two-column-split.md
- id: PLT-03
  title: The Plates Are One Set
  ask: Every plate in a project shares one viewBox, one ground, and one handful of inks taken from the
    token block. Two grids and two palettes read as clip art collected rather than art commissioned, and
    the difference is visible the moment two of them sit on the same page.
  probe: true
  kinds:
  - web-ui
  when: image
  severity: required
  fix: Redraw the outliers on the shared viewBox and restrict every plate to the same four to six inks.
  source: references/icon-design.md
- id: PLT-04
  title: A Plate Is Drawn, Not Silhouetted
  ask: 'The difference between a drawing and a sticker is countable. A silhouette is one outline in one
    fill: the subject''s edge and nothing inside it. A drawing has the parts the subject actually has
    - the wheelhouse, the stacks, the coaming, the rake of the bow - and it carries a second tone wherever
    a face turns away from the light. Twelve shapes and five inks is not a standard of taste; it is the
    floor a first pass falls through.'
  probe: true
  severity: required
  fix: Draw the subject's own parts rather than its outline, and give every material a lit face and a
    turned one from the same token ramp.
- id: PLT-05
  title: The Ground Is Drawn Once
  ask: 'A plate either carries its own ground or takes the surface it lands on, and the placement agrees
    with the file. The sharp fault is a card behind transparent art: the shadow and the border trace a
    rectangle the drawing does not fill, so the page shows a frame with nothing in it. The reverse - a
    plate that already draws its card, wrapped in a second - is the same fault costing less. Which way
    round is a real decision: a map without a ground is a set of lines in the air, and a scene with one
    is a block on every surface it meets.'
  probe: true
  severity: required
  fix: 'Decide the ground against the surface the plate lands on: draw it in the file where the placement
    needs a card, and drop the card classes everywhere the file draws none.'
- id: PLT-06
  title: A Page Plate Is Sized Off Its Column
  ask: 'A drawing pinned to the height of a heading reads as a mark above it, and the eye skips it on
    the way to the words. Imagery for a block is as wide as the block will let it be: a width off the
    column with a max-width, not a fixed height. Chrome is the exception and always was, because a panel
    has the room it has.'
  probe: true
  severity: required
  fix: Replace the fixed height with w-full and a max-width, and let the column decide how big the plate
    is.
  source: references/hallmark/references/components/mm2-two-column-split.md
- id: EML-01
  title: Layout Is Tables
  ask: The layout is nested tables. Flexbox and grid are unreliable in Outlook, which renders through
    the Word engine, so a layout built on them collapses for a large share of business readers.
  probe: true
  kinds:
  - email
  when: always
  severity: blocker
  fix: Move the layout onto nested tables and put every declaration inline on the cell it governs.
  source: references/intelligence.md#email
- id: EML-02
  title: No Stylesheet, Script, Or Font Host
  ask: A style block, a link element, a script, or an import from a font host. Every one is stripped or
    ignored, and a message that fetches a font announces itself as a campaign before it is read.
  probe: true
  kinds:
  - email
  when: always
  severity: blocker
  fix: Delete them and name a system font stack inline on each cell.
  source: references/intelligence.md#email
- id: EML-03
  title: No SVG
  ask: Gmail strips SVG outright and Outlook will not draw it. Anything vector is either a raster served
    over https or is drawn with cell borders, background colours, and border-radius.
  probe: true
  kinds:
  - email
  when: always
  severity: blocker
  fix: Rasterise the mark to PNG at twice its displayed size, or draw the shape with table cells.
  source: references/intelligence.md#email
- id: EML-04
  title: Every Image Declares Its Width
  ask: An explicit width attribute on the tag, so the layout holds while images load and when they never
    do. Outlook blocks images by default, and a box with no declared size collapses to nothing.
  probe: true
  kinds:
  - email
  when: image
  severity: blocker
  fix: Add width and height attributes to every img, and serve the file at twice its displayed size.
  source: references/intelligence.md#email
- id: EML-05
  title: Every Image Carries Alt Text
  ask: Alt text saying what the image shows, because for a reader with images off it is the image. A missing
    alt leaves a blank where the proof was.
  probe: true
  kinds:
  - email
  when: image
  severity: blocker
  fix: Add descriptive alt text to every img, naming what it shows rather than the file.
  source: references/intelligence.md#email
- id: EML-06
  title: No Tracking Pixel
  ask: A one-by-one image whose only job is to report an open. Filters read it as a campaign marker, the
    privacy proxies most readers now sit behind strip it, and what it reports is wrong often enough not
    to be worth the cost.
  probe: true
  kinds:
  - email
  when: always
  severity: blocker
  fix: Delete it. Measure replies and visits instead.
  source: references/intelligence.md#email
- id: EML-07
  title: The Link Is Its Own Destination
  ask: Every href is the full URL it goes to. A shortener hides the destination from the reader and from
    the filter, and both treat that as what it is.
  probe: true
  kinds:
  - email
  when: always
  severity: required
  fix: Replace the shortened link with the destination it points at.
  source: references/intelligence.md#email
- id: EML-08
  title: A One-Click Unsubscribe
  ask: The List-Unsubscribe and List-Unsubscribe-Post headers, so a mailbox provider can offer its own
    control beside the sender's name. Asking somebody to compose a reply is friction they will not accept,
    and providers now expect the headers from anything sending at volume.
  probe: true
  kinds:
  - email
  when: always
  severity: blocker
  fix: Add the token-based endpoint, put the link in both halves, and set both headers on every send.
  source: references/intelligence.md#email
- id: EML-09
  title: A Plain-Text Half
  ask: The message goes as multipart with a text alternative, built from the same content so the two cannot
    drift. A message with no text half is one a filter scores worse and some readers never see.
  probe: true
  kinds:
  - email
  when: always
  severity: blocker
  fix: Render both halves from the same paragraphs and pass both to the transport.
  source: references/intelligence.md#email
- id: EML-10
  title: The Postal Address Is Carried
  ask: Commercial email is required to carry a physical postal address, and a footer that names only a
    brand is one a reader cannot answer and a regulator can act on.
  probe: true
  kinds:
  - email
  when: always
  severity: blocker
  fix: Put the postal line in the footer of both halves, read from configuration rather than typed in.
  source: references/intelligence.md#email
- id: EML-11
  title: The Sheet Goes Fluid
  ask: A fixed sheet width with a max-width beside it, so the message holds its column on a desktop and
    fills the screen on a phone. A fixed width alone is a horizontal scroll for most of the people who
    open it.
  probe: true
  kinds:
  - email
  when: always
  severity: required
  fix: Give the outer table a fixed width and a max-width, and let the cells inside it size to their content.
  source: references/intelligence.md#email
- id: EML-12
  title: Grounds Are Declared, Not Inherited
  ask: Mail clients apply their own dark mode by inverting light grounds and leaving dark ones alone.
    A cell with no declared background is the one that comes out wrong, so bgcolor sits beside every background-color.
  probe: true
  kinds:
  - email
  when: always
  severity: required
  fix: Set bgcolor and background-color on every band and every nested cell that sits on a ground of its
    own.
  source: references/intelligence.md#email
- id: PTR-01
  title: Cursor Pointer On Every Clickable
  ask: 'Every element that responds to a click carries cursor: pointer - every button, card with an onClick,
    tab, custom control, clickable table row, and icon button, not one of them. A native <a href> has
    it already; a <button> and a <div> with a handler do not.'
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: 'Add cursor: pointer to the control''s base rule, or to the shared button/pressable primitive.'
  source: references/intelligence.md#2-touch--interaction (cursor-pointer)
- id: PTR-02
  title: Press Feedback On Every Pressable
  ask: 'Every pressable element scales down on :active - transform: scale(0.95-0.98) with a 100-160ms
    transform transition, or an equivalent press the design commits to. This is the click effect, and
    it is checked per element: one :active in a codebase of forty buttons means thirty-nine controls that
    do not answer the finger.'
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: 'Add :active { transform: scale(0.97) } plus transition: transform 160ms var(--ease-out) to the
    control primitive.'
  source: references/polish.md#buttons-must-feel-responsive; slop gate 26
- id: PTR-03
  title: Press Scale Is Subtle And In Range
  ask: The press scale sits between 0.95 and 0.98. Below 0.95 reads as a jolt; above 0.99 is invisible.
    scale(0) or a scale that changes layout bounds fails outright.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: Bring the scale into 0.95–0.98.
  source: references/polish.md#buttons-must-feel-responsive
- id: PTR-04
  title: Press Feedback Does Not Shift Layout
  ask: The pressed state changes transform, opacity, colour, or shadow — never padding, margin, width,
    height, or border-width. A press that reflows the row makes the whole page twitch.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Move the effect onto transform or opacity.
  source: references/intelligence.md#stable-interaction-states; slop gate 14
- id: PTR-05
  title: Hover State On Every Interactive Element
  ask: Every interactive element has a distinct hover state, individually. The pointer needs to know what
    is live before it commits, on every control rather than on the ones that happened to get styled.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Add the hover state to the control primitive.
  source: references/intelligence.md#4-style-selection (state-clarity)
- id: PTR-06
  title: Hover Motion Gated Behind A Pointer Query
  ask: 'Any hover state that moves or scales sits inside @media (hover: hover) and (pointer: fine). Touch
    devices fire hover on tap, so an ungated hover-scale leaves a phone stuck in the hovered state after
    a tap.'
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: 'Wrap the hover-motion rules in @media (hover: hover) and (pointer: fine).'
  source: references/polish.md#touch-device-hover-states
- id: PTR-07
  title: One Hover Effect At A Time
  ask: No element stacks more than one hover effect. Translate plus scale plus shadow plus colour plus
    rotate on the same hover is the loudest AI tell in the set.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: Keep the one effect that carries the meaning; delete the rest.
  source: slop gate 13
- id: PTR-08
  title: No Uniform hover:scale-105 Sprayed Across The Page
  ask: A single hover-scale applied to unrelated elements — cards, buttons, logos, images alike — is a
    template signature, not a design decision.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: 'Differentiate: lift the card, tint the button, do nothing to the logo.'
  source: slop gate 11
- id: PTR-09
  title: Focus-Visible Ring On Every Interactive Element
  ask: 'Every interactive element has a :focus-visible ring, 2-4px, clearing 3:1 against both the element
    and the page. Checked per element: an unscoped global rule covers everything, a per-component one
    covers only what it names.'
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Add the focus-visible ring to the control primitive using the focus token.
  source: references/intelligence.md#1-accessibility (focus-states); slop gate 26
- id: PTR-10
  title: Focus Ring Appears Instantly
  ask: The focus ring does not transition into existence. A ring that fades in leaves the keyboard user
    momentarily unsure where they are.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: Exclude outline and box-shadow from the transition property list on the focused element.
  source: slop gate 15
- id: PTR-11
  title: Focus Never Removed Without Replacement
  ask: 'outline: none appears only where a replacement focus indicator is defined in the same rule set.
    A bare outline: none is an accessibility failure.'
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: blocker
  fix: Pair it with a :focus-visible box-shadow or outline of your own.
  source: references/intelligence.md#1-accessibility
- id: PTR-12
  title: Disabled State Is Visible And Inert
  ask: 'Disabled controls carry reduced emphasis (0.38–0.5 opacity or a muted token), cursor: not-allowed,
    no hover effect, no press effect, and the real disabled attribute — not just a class. A control that
    looks pressable and does nothing is a bug the user blames on themselves.'
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: 'Add the disabled rule set with cursor: not-allowed, and set the real disabled attribute.'
  source: references/intelligence.md#8-forms--feedback (disabled-states); slop gate 26
- id: PTR-13
  title: Cursor Matches The Affordance
  ask: 'cursor: text on text inputs, not-allowed on disabled, grab and grabbing on draggables, col-resize
    on resizers, wait on blocking work, zoom-in on zoomable images. A default arrow over a specialised
    control tells the user nothing. What never appears is a replaced cursor: cursor: url() or a hidden
    native cursor with a drawn one following it, which TST-30 refuses.'
  probe: false
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: Set the cursor that names the affordance on each control type, and remove any custom cursor layer.
  source: references/intelligence.md#2-touch--interaction
- id: PTR-14
  title: Tap Highlight And Selection Are Themed
  ask: -webkit-tap-highlight-color is set (usually transparent, with the press state doing the work) so
    mobile taps do not flash the default blue box. ::selection carries a themed background that reads
    in all three themes.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: required
  fix: 'Add -webkit-tap-highlight-color: transparent and a ::selection rule using theme tokens.'
  source: references/polish.md#component-building-principles; references/code/shadcn-theming.md
- id: PTR-15
  title: 'touch-action: manipulation On Tappables'
  ask: 'Tappable elements set touch-action: manipulation to drop the 300ms mobile click delay. Without
    it every tap on the site feels a third of a second late.'
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: 'Add touch-action: manipulation to the button/pressable primitive.'
  source: references/intelligence.md#2-touch--interaction (tap-delay)
- id: PTR-16
  title: Control Labels Are Not Selectable
  ask: 'user-select: none on button labels, tab labels, and nav items. Text that highlights when a user
    double-clicks a button reads as a bug.'
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: advisory
  fix: 'Add user-select: none to the control primitive; leave body copy selectable.'
  source: references/polish.md#component-building-principles
- id: PTR-17
  title: Touch Targets Clear 44px
  ask: Every interactive element has at least a 44x44pt hit area with 8px between neighbours, including
    icon-only buttons — extend the hit area past the visual bounds when the icon is smaller.
  probe: false
  kinds:
  - web-ui
  - component
  - banner
  when: interactive
  severity: blocker
  fix: Pad the control or add a pseudo-element hit area; keep the visual size.
  source: references/intelligence.md#2-touch--interaction (touch-target-size)
- id: PTR-18
  title: Feedback Lands Within 100ms
  ask: Something visible happens within 100ms of the press — the press scale, a ripple, an opacity shift.
    Work that takes longer shows a loading state on the control itself, not a frozen button.
  probe: false
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: Keep the press transition at 100–160ms and put the async state on the control.
  source: references/intelligence.md#3-performance (tap-feedback-speed)
- id: PTR-19
  title: Async Controls Disable And Show Progress
  ask: A control that fires async work disables itself for the duration and shows a spinner or progress,
    so a second click cannot double-submit.
  probe: false
  kinds:
  - web-ui
  - component
  when: form
  severity: required
  fix: Wire the pending state to the control's disabled attribute and swap the label for a spinner.
  source: references/intelligence.md#2-touch--interaction (loading-buttons)
- id: PTR-20
  title: Scroll Containers Contain Their Scroll
  ask: 'Scrollable regions set overscroll-behavior: contain so a scroll that reaches the end does not
    chain to the page behind. Modals and drawers lock the body scroll while open.'
  probe: true
  kinds:
  - web-ui
  - component
  when: modal
  severity: required
  fix: 'Add overscroll-behavior: contain to the scroll container and lock body scroll while the overlay
    is open.'
  source: references/intelligence.md#5-layout--responsive (scroll-behavior)
- id: PTR-21
  title: Drag Has A Threshold And Live Response
  ask: Drag starts after a movement threshold so a slightly-moved click is still a click, and the dragged
    element tracks the pointer in real time with damping at the boundaries.
  probe: false
  kinds:
  - web-ui
  - component
  when: drag
  severity: required
  fix: Add the movement threshold and pointer capture; damp past the edges rather than hard-stopping.
  source: references/polish.md#gesture-and-drag-interactions
- id: PTR-22
  title: Interactive Elements Are Real Controls
  ask: Clickable things are <button>, <a>, or a native primitive with the right role, not a <div> with
    an onClick. Keyboard, screen reader, and focus behaviour come free from the real element and have
    to be rebuilt badly on the fake one.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Swap the div for a button, or add role, tabindex, and key handlers.
  source: references/intelligence.md#interaction-app (semantic-native-controls)
- id: PTR-23
  title: Rows And Cards Answer The Pointer
  ask: Any row, card, or tile that can be clicked tints on hover across its whole surface, not just its
    title. A hover that only lights the link inside makes the rest of the row look inert when it is not.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Move the hover to the row or card container, applied through its cells where cell backgrounds would
    paint over it.
  source: references/code/tables-and-headers.md
- id: PTR-24
  title: Hover Uses One Vocabulary
  ask: One way of saying hovered across the product - a surface step, or a brightness shift, or a border
    change - not a different one per component. Mixed vocabularies read as different products stitched
    together.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  fix: Pick the hover vocabulary and move the outliers onto it.
  source: checklist/README.md#cohesion
- id: PTR-25
  title: Hover Never Reveals Something Only Hover Can Reach
  ask: Actions, values, and controls that appear on hover do not exist on touch and are hard to find by
    keyboard. Keep them present at reduced emphasis and raise them on hover, rather than mounting them
    on it.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Render at low opacity by default and raise on hover and focus-within.
  source: references/intelligence.md#2-touch--interaction
- id: PTR-26
  title: Hover Does Not Move The Layout
  ask: A hover state changes colour, shadow, or transform - never width, height, padding, margin, or border-width.
    A row that grows on hover pushes everything below it every time the pointer crosses the table.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: blocker
  fix: Move the effect onto transform, colour, or shadow.
  source: references/polish.md#performance-rules
- id: PTR-27
  title: Hover-Triggered Overlays Have Intent
  ask: Anything that opens on hover - a tooltip, a preview, a submenu - waits out an accidental pass and
    forgives the diagonal path toward it. Opening instantly on every crossing makes a dense list flicker.
  probe: false
  kinds:
  - web-ui
  - component
  when: tooltip
  fix: Add an open delay and a close grace period, and keep the submenu open along the pointer's path
    toward it.
  source: references/polish.md#tooltips-skip-delay-on-subsequent-hovers
- id: PTR-28
  title: The Pointer Is Not Required To Discover Anything
  ask: Nothing essential is discoverable only by moving a mouse over it. Every hover affordance has a
    keyboard and touch equivalent that surfaces the same thing.
  probe: false
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Pair every hover reveal with focus-within and a tap or long-press path.
  source: references/intelligence.md#2-touch--interaction
- id: PTR-29
  title: Text Selection Works Where Text Is Read
  ask: Body copy, table cells, code, and values stay selectable; only control labels are not. A page that
    blocks selection wholesale stops readers copying the thing they came for.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  fix: 'Scope user-select: none to the control primitives rather than the page.'
  source: references/code/fields-and-dropdowns.md
- id: PTR-30
  title: Scroll Regions Say They Scroll
  ask: A container that scrolls shows it - a visible scrollbar, a fade at the edge, or content clipped
    mid-row. A scroll region whose content ends flush at the boundary reads as the end of the list.
  probe: false
  kinds:
  - web-ui
  - component
  when: css
  severity: advisory
  fix: Keep the scrollbar visible, or add an edge fade that appears while there is more to reach.
  source: references/code/tables-and-headers.md
- id: PTR-31
  title: Click Effect At The Pointer
  ask: 'Clicking anywhere on a page produces something at the cursor - a ripple, a spark, a short wave
    from the click point. This is separate from the press feedback on the control that was hit: a site
    where every button scales on :active and nothing else answers still feels dead under the hand. Where
    a site has no click effect, add one; it is not a question to put to the brief.'
  probe: true
  kinds:
  - web-ui
  when: interactive
  severity: blocker
  fix: 'Mount one global pointerdown listener that draws a short-lived element at clientX/clientY on a
    fixed, pointer-events: none layer, and let it animate out. references/code/click-effect.md carries
    the implementation.'
  source: references/code/click-effect.md
- id: PTR-32
  title: Click Effect Does Not Block Or Insist
  ask: 'The layer a click effect draws on carries pointer-events: none, so it never swallows a click,
    and the effect stands down under prefers-reduced-motion. An effect that eats clicks is worse than
    no effect.'
  probe: true
  kinds:
  - web-ui
  when: interactive
  severity: blocker
  fix: 'Give the overlay position: fixed; inset: 0; pointer-events: none, and skip the spawn when matchMedia(''(prefers-reduced-motion:
    reduce)'').matches.'
  source: references/code/click-effect.md
- id: FLD-01
  title: Fields Sit On Their Own Surface
  ask: The field background is a token distinct from the page ground behind it, in all three themes. A
    field the same colour as the page is a label with a border, and readers stop seeing it as somewhere
    to type.
  probe: true
  severity: blocker
  fix: Define a field surface token per theme and apply it to input, textarea, and select.
- id: FLD-02
  title: Field Borders Clear 3:1
  ask: The border is a UI boundary, so it needs 3:1 against the surface behind it in every theme. A hairline
    that only just shows in light mode is gone in gray.
  probe: false
  severity: blocker
  fix: Raise the border token's contrast, or carry the boundary with a surface shift instead.
- id: FLD-03
  title: Placeholder Is Not The Label
  ask: A placeholder disappears the moment there is content, taking the field's meaning with it. Every
    field keeps a visible label, and the placeholder clears 4.5:1 rather than sitting at the pale grey
    that comes for free.
  probe: true
  severity: blocker
  fix: Add the visible label, and lift the placeholder colour onto a token that clears 4.5:1.
- id: FLD-04
  title: One Control Height, Shared
  ask: Input, select, and button take the same height token, with a 44px floor on touch. A 38px input
    beside a 44px button is the most common tuning miss in a generated form.
  probe: true
  severity: blocker
  fix: Define a control height token and reference it from every control rule.
- id: FLD-05
  title: Field Text Is At Least 16px
  ask: Below 16px, iOS zooms the whole page when the field takes focus and leaves the reader zoomed in.
    This holds even where the surrounding type is smaller.
  probe: true
  severity: blocker
  fix: 'Set font-size: max(16px, <your token>) on the field.'
- id: FLD-06
  title: Invalid Is Not Colour Alone
  ask: An invalid field carries aria-invalid, a message, and an icon or marker. A red border says nothing
    to a screen reader and little to a colourblind reader.
  probe: true
  severity: blocker
  fix: Set aria-invalid on the field and pair the colour with a message and a marker.
- id: FLD-07
  title: Native Select Chrome Is Replaced Or Kept On Purpose
  ask: 'A bare select renders OS chrome that ignores every token. Either style the native control with
    appearance: none and your own chevron, keeping the platform''s option list and its accessibility,
    or build a real listbox. State which route was taken.'
  probe: true
  severity: blocker
  fix: 'Set appearance: none on the select and supply the chevron, padding for it, and the field surface.'
- id: FLD-08
  title: A Custom Listbox Owes The Whole Contract
  ask: 'Replacing the native select means rebuilding all of it: arrow keys cycling and wrapping, Home
    and End, Enter or Space to select, Escape to close without selecting, typeahead, aria-expanded mirroring
    visibility, role listbox or menu, aria-selected on options, focus returning to the trigger on close,
    and outside-click dismissal. A div with a click handler is not a select.'
  probe: true
  when: menu
  severity: blocker
  fix: Use the platform Popover API or a headless primitive rather than hand-rolling the contract.
- id: FLD-09
  title: Menu Is Not Clipped By An Ancestor
  ask: A menu inside an overflow-hidden or overflow-auto ancestor is cut off at the container edge, and
    it looks like a rendering bug rather than a layout one. Portal it to the body or use the Popover API,
    which handles stacking and light-dismiss on its own.
  probe: true
  when: menu
  severity: blocker
  fix: Portal the menu, or move to the Popover API.
- id: FLD-10
  title: Menu Flips At The Viewport Edge
  ask: A menu near the bottom of the viewport opens upward; near the right edge it aligns right. Without
    it the last option is unreachable on a laptop and the menu runs off the screen on a phone.
  probe: false
  when: menu
  severity: blocker
  fix: Use a positioning library or the Popover API's anchor handling rather than a fixed offset.
- id: FLD-11
  title: Menu Has A Max Height And Scrolls Inside Itself
  ask: A menu is capped at something like min(320px, 60vh) with overflow-y auto and overscroll-behavior
    contain, so a long list never exceeds the viewport and scrolling it never scrolls the page behind.
  probe: true
  when: menu
  severity: blocker
  fix: 'Add the max-height, overflow-y: auto, and overscroll-behavior: contain to the menu surface.'
- id: FLD-12
  title: Menu Surface Is Opaque And Elevated
  ask: The menu has its own raised surface token, a border or shadow separating it from what it covers,
    and no transparency. A translucent menu over body text is unreadable and reads as unfinished.
  probe: true
  when: menu
  severity: blocker
  fix: Give the menu a raised surface token, a rule, and a shadow, and drop any alpha from its background.
- id: FLD-13
  title: Menu Sits On The Named Z-Layer
  ask: The menu takes its stacking from the layer scale, above the page and below modals. A z-index of
    9999 is a guess that collides with the next guess.
  probe: true
  when: menu
  fix: Add a dropdown step to the z-index scale and reference it.
- id: FLD-14
  title: Menu Does Not Push Page Content
  ask: The menu is absolutely or fixed positioned. A menu in normal flow shoves everything below it down
    as it opens, which reads as the page breaking.
  probe: false
  when: menu
  severity: blocker
  fix: Position the menu absolutely against a positioned parent, or portal it.
- id: FLD-15
  title: Menu Width Relates To Its Trigger
  ask: The menu is at least the trigger's width and does not jump between openings as its content changes.
    A menu narrower than the control it belongs to reads as detached from it.
  probe: false
  when: menu
  fix: Set min-width to the trigger's width, measured or via the anchor's size.
- id: FLD-16
  title: Hover, Focused, And Selected Are Three Distinct States
  ask: Arrowing through a menu while the mouse rests on a different row must not light two rows the same
    way. Hover is a surface tint; focused adds a marker such as a left rule or ring; selected is the current
    value.
  probe: true
  when: menu
  severity: blocker
  fix: Give the focused option a marker the hover state does not have.
- id: FLD-17
  title: Selected Carries A Marker In A Reserved Gutter
  ask: The current value is marked by a check or dot, not by colour alone, and the gutter holding it is
    reserved on every row so labels do not shift when the selection moves.
  probe: false
  when: menu
  fix: Reserve the marker column on all options and render the marker only on the selected one.
- id: FLD-18
  title: Long Option Labels Stay Readable
  ask: A label longer than the menu truncates with the full text reachable through a title, a tooltip,
    or a two-line wrap. A label sliced mid-word with no way to read it is a dead end.
  probe: false
  when: menu
  severity: advisory
  fix: Truncate with an ellipsis and expose the full string.
- id: FLD-19
  title: Menu Has Empty And Loading States
  ask: A filtered menu with no matches says so, and one that fetches its options shows placeholder rows.
    An empty box reads as broken.
  probe: false
  when: menu
  fix: Add the no-results row and, where options are fetched, placeholder rows in the option's shape.
- id: FLD-20
  title: Menu Opens From Its Trigger, Fast
  ask: 150 to 250ms, ease-out, scaling from the trigger's transform-origin rather than its own centre,
    and stopped under reduced motion.
  probe: false
  when: menu
  fix: Set the popover transform-origin variable and cap the duration.
- id: FLD-21
  title: Date, Time, And Colour Pickers Follow The Same Rules
  ask: 'The trigger is a field, the panel is a menu, and the grid inside needs six states, not three:
    hover, focused, selected, today, out-of-range, and disabled. The native picker indicator is themed
    too, or it renders as the platform''s icon on the wrong background.'
  probe: true
  when: picker
  fix: Theme the calendar picker indicator per theme and give the grid all six states.
- id: FLD-22
  title: Checkbox, Radio, And Switch Are Themed
  ask: accent-color set from the accent token gets these right cheaply on modern browsers. A custom one
    still owes the focus ring, the 44px hit area, and the native semantics — a switch is a checkbox whatever
    it looks like.
  probe: true
  fix: Set accent-color on the inputs, or give the custom control its focus ring and semantics.
- id: FLD-23
  title: Autofilled Fields Keep The Design's Colours
  ask: 'A browser paints its own pale yellow over a field it filled and keeps it through hover and focus,
    and background-color does not reach it. The override covers every field on the page, not only the
    ones the project draws: a hosted sign-in widget renders its own inputs, and those are the fields a
    visitor is most likely to have saved credentials for.'
  probe: true
  severity: blocker
  fix: Add an unlayered :-webkit-autofill rule on input, textarea and select. Repaint the project's own
    fields with an inset box-shadow the height of the field, and neutralise the rest by delaying the background-color
    transition, which leaves each field the background it already had.
- id: TBL-01
  title: Rows Are Dense And Single-Line
  ask: A list that runs to hundreds of rows is scanned, and anything taller than it needs turns scanning
    into scrolling. Padding, type size, and any pill or badge inside the row are tuned together - grow
    one and the row height goes with it.
  probe: false
  fix: Set one row height token and size everything inside the row against it.
- id: TBL-02
  title: The Row Answers The Pointer
  ask: Hovering a row tints the whole row, applied through its cells rather than the row element, because
    cell backgrounds paint over a tr background and leave the hover half-applied.
  probe: true
  severity: blocker
  fix: Tint the cells on row hover, in the pattern hover:[&>td]:bg-<surface>.
- id: TBL-03
  title: A Clickable Row Says So
  ask: 'A row that navigates carries cursor: pointer, a hover state, a focus-visible ring, and keyboard
    reachability. A row that only responds to a mouse is invisible to half its users.'
  probe: true
  severity: blocker
  fix: Give the row a real interactive element, or role, tabIndex, and key handling alongside the pointer
    cursor.
- id: TBL-04
  title: Header Stays While The Body Scrolls
  ask: The header row is sticky at the top of its scroll container, on its own opaque surface and above
    the rows in the layer scale. A header that scrolls away leaves every column unlabelled by the second
    screen.
  probe: true
  severity: blocker
  fix: 'Set position: sticky and top: 0 on the header cells with an opaque background and a z-index from
    the scale.'
- id: TBL-05
  title: Numbers Are Tabular And Right-Aligned
  ask: Numeric columns use tabular figures and align right so digits line up down the column. Proportional
    figures make a column of numbers impossible to compare at a glance and jitter as values change.
  probe: true
  severity: blocker
  fix: 'Add font-variant-numeric: tabular-nums and right-align the numeric cells and their headers.'
- id: TBL-06
  title: Column Alignment Matches Content Type
  ask: Text left, numbers right, status and actions centred or right, and the header aligns with its column.
    A right-aligned header over left-aligned text reads as a mistake because it is one.
  probe: false
  fix: Align each header to its column's content.
- id: TBL-07
  title: Row Separators Are One Hairline
  ask: 'One border token separating rows, or zebra striping, never both. A table carrying both is louder
    than its data. The same holds for a list that is a table in everything but its tag: a spec sheet with
    a hairline under all ten rows is held by TST-18.'
  probe: true
  fix: Pick the rule or the stripe and remove the other.
- id: TBL-08
  title: Sortable Columns Announce Their Sort
  ask: A sortable header carries aria-sort reflecting the current direction, shows an indicator, and is
    operable by keyboard. An arrow with no aria-sort is a sort only sighted mouse users can follow.
  probe: true
  when: sortable
  severity: blocker
  fix: Add aria-sort to the sorted header and make the header a real button.
- id: TBL-09
  title: Sort Indicator Space Is Always Reserved
  ask: The indicator's column is reserved on every sortable header whether or not it is the sorted one,
    so headers do not shift sideways as the sort moves.
  probe: false
  when: sortable
  fix: Render the indicator slot on every sortable header and toggle its visibility, not its presence.
- id: TBL-10
  title: The Table Has A Small-Screen Answer
  ask: On a phone the table stacks into cards, scrolls inside its own container, or drops to the columns
    that matter. It never overflows the page, and a horizontally scrolling table declares its own overflow
    container.
  probe: true
  severity: blocker
  fix: 'Wrap the table in an overflow-x: auto container, or render a card layout below the breakpoint.'
- id: TBL-11
  title: Row Actions Are Reachable Without Hover
  ask: Actions that appear only on hover do not exist on touch and are hard to find with a keyboard. Keep
    them present at reduced emphasis, or put them behind a visible overflow control.
  probe: true
  severity: blocker
  fix: Render the actions at low emphasis by default and raise them on hover, rather than mounting them
    on hover.
- id: TBL-12
  title: Icon-Only Row Actions Are Labelled
  ask: Every icon button in a row carries an aria-label and a title, so it is both announced and hoverable-to-identify.
  probe: true
  severity: blocker
  fix: Add aria-label and title naming the action, not the icon.
- id: TBL-13
  title: Empty, Loading, And Failed Tables Differ
  ask: No rows yet, no rows matching the filter, still loading, and the request failed are four different
    states with four different messages. A blank table body is none of them.
  probe: true
  severity: blocker
  fix: Branch the four states, with placeholder rows for loading and a retry on failure.
- id: TBL-14
  title: Loading Rows Are The Row's Own Shape
  ask: Placeholder rows match the real row's height, column widths, and count, inside the same table.
    See the SKL gates for the measurement.
  probe: false
  severity: blocker
  fix: Render placeholder rows through the same row component.
- id: TBL-15
  title: Row Entrance Decays Rather Than Crawling
  ask: Where rows animate in, the per-row delay decays so early rows cascade and later ones arrive almost
    together. A flat 80ms stagger over two hundred rows takes sixteen seconds.
  probe: false
  severity: advisory
  fix: Apply an exponential decay to the row delay with a floor of a few milliseconds, and stop it under
    reduced motion.
- id: TBL-16
  title: Status Cells Use The Shared Badge Vocabulary
  ask: A status in a table reads identically to the same status in a detail panel or a card - one mapping
    from status to tone, one badge component, all three themes. Two spellings of the same state is the
    fastest way to make a product feel assembled from parts.
  probe: false
  severity: blocker
  fix: Map status to tone in one place and render through the shared badge.
- id: TBL-17
  title: Selection Is Visible And Countable
  ask: Selected rows are marked beyond colour, the count is shown, and select-all states include the indeterminate
    one. Bulk actions appear only with a selection and say how many they will affect.
  probe: false
  when: selectable
  fix: Add the selected marker, the count, and the indeterminate header checkbox.
- id: TBL-18
  title: Long Cell Content Truncates With A Way To Read It
  ask: Cells truncate to keep the row single-line, and the full value stays reachable through a title,
    a tooltip, or the row's detail view.
  probe: false
  severity: advisory
  fix: Truncate with an ellipsis and expose the full value.
- id: TBL-19
  title: Large Tables Virtualise
  ask: Past roughly fifty rows the body virtualises, keeping scroll smooth and memory flat. The sticky
    header and column widths survive virtualisation.
  probe: false
  when: list
  fix: Virtualise the row list while keeping the header outside the virtual window.
- id: TBL-20
  title: The Table Is A Table
  ask: Real table, thead, tbody, th with scope, and a caption or accessible name. A grid of divs is unreadable
    to a screen reader and unnavigable by table shortcuts.
  probe: true
  severity: blocker
  fix: Use the table elements, with scope on header cells and a caption or aria-label on the table.
- id: HDR-01
  title: Every Surface Uses The Same Header Rhythm
  ask: Title, then supporting chips or counts, then a spacer, then actions - in that order, at the same
    height and padding, on every page of the product. A header that reorders itself per section makes
    each section feel like a different application.
  probe: true
  severity: blocker
  fix: Extract one header component and compose the per-page differences as props.
- id: HDR-02
  title: A Sticky Header Is Opaque And Layered
  ask: A header that sticks carries an opaque background, a bottom rule or shadow to separate it from
    what scrolls beneath, and a z-index from the named scale above in-page sticky elements.
  probe: true
  severity: blocker
  fix: Give the sticky header an opaque surface token, a bottom border, and the nav layer from the z-index
    scale.
- id: HDR-03
  title: One Sticky Thing At The Top
  ask: 'A page header and a section header both sticking at top: 0 overlap, and the one deeper in the
    DOM paints over the other. Secondary sticky elements offset by the header''s height.'
  probe: true
  severity: blocker
  fix: Define a header height token and offset every secondary sticky element to it.
- id: HDR-04
  title: The Header Does Not Shrink The Content Behind It
  ask: A fixed or sticky header reserves its height on the scrolling content, so the first row is not
    hidden underneath it on load or after an anchor jump.
  probe: true
  severity: blocker
  fix: Add scroll-margin-top on anchor targets and padding matching the header height on the scroll container.
- id: HDR-05
  title: The Title Is The Loudest Thing In It
  ask: One h1 per page, at the top of the header, heavier and larger than everything beside it. A header
    where the action button outweighs the title tells the reader the button is where they are.
  probe: true
  severity: blocker
  fix: Set the title's weight and size above the chips and controls beside it.
- id: HDR-06
  title: Header Counts Are Tabular
  ask: Counts and figures in a header use tabular figures, so the header does not reflow every time a
    number ticks.
  probe: true
  fix: 'Add font-variant-numeric: tabular-nums to the count element.'
- id: HDR-07
  title: Header Actions Are Right, Title Is Left
  ask: Title and context on the leading edge, actions on the trailing edge, separated by a flexible spacer
    rather than a fixed margin. Actions that drift with the title's length are actions the reader has
    to hunt for.
  probe: false
  fix: Put a flex-1 spacer between the title group and the action group.
- id: HDR-08
  title: Header Actions Survive A Narrow Viewport
  ask: Labels collapse to icons or into an overflow control below the breakpoint, and the header never
    wraps into two rows of controls or pushes its title out of view.
  probe: false
  severity: blocker
  fix: Hide the label text at narrow widths with the icon carrying the action, keeping the accessible
    name.
- id: HDR-09
  title: Header Controls Are Vertically Centred
  ask: 'The header row declares align-items: center with line-height 1 on the items that have intrinsic
    height. Default flex stretch makes a button taller than the title beside it and breaks the baseline.'
  probe: false
  fix: 'Set align-items: center on the header row.'
- id: HDR-10
  title: Section Heads Stack, They Do Not Sit Beside
  ask: 'An eyebrow, number, or kicker goes directly above its heading in the same column, never in a column
    beside it. The side-by-side arrangement reads as a templated editorial tell within seconds. The same
    tell wearing a different shape: a big left-aligned headline with a small explainer paragraph floating
    in the section head''s top-right corner, aligned to nothing. Stack it under the headline at a 65ch
    measure, or give the right column a real visual.'
  probe: false
  severity: blocker
  fix: Flatten the head wrapper to a single column, and move any floating corner paragraph under the headline.
- id: HDR-11
  title: Header Height Is A Token
  ask: The header's height is a named value, because sticky offsets, scroll padding, and anchor margins
    all have to agree with it. Three hardcoded copies of 64px drift the first time one changes.
  probe: true
  fix: Define a header height token and reference it from the header, the offsets, and the scroll padding.
- id: HDR-12
  title: Breadcrumbs And Back Sit In The Header
  ask: Where a page is reached from somewhere, the way back lives in the header at a consistent position,
    not invented per page.
  probe: false
  when: nav
  severity: advisory
  fix: Add the back or breadcrumb slot to the shared header component.
- id: SPC-01
  title: Adjacent Panels Do Not Share An Edge
  ask: Two bordered or surfaced blocks stacked one after another always have space between them. At zero
    gap their borders meet and read as one double-ruled box, or as a rendering fault - and it is the single
    most common spacing defect in a generated form, because each panel is correct on its own.
  probe: true
  severity: blocker
  fix: Put the gap on the parent stack rather than on either panel, so it cannot be lost when one panel
    is reordered or removed.
- id: SPC-02
  title: Stacks Declare Their Gap
  ask: A column of blocks takes its spacing from the container's gap, not from margins on its children.
    Margins collapse, differ between the first and last child, and go missing the moment a child is conditionally
    rendered.
  probe: true
  severity: blocker
  fix: Set gap on the flex or grid container and remove the vertical margins from its children.
- id: SPC-03
  title: Gaps Within A Stack Are Equal
  ask: Every gap between siblings in one stack is the same, unless a deliberate group break says otherwise.
    One gap wider than its neighbours reads as a missing element.
  probe: true
  severity: blocker
  fix: Move the odd gap onto the container's gap, or make the break explicit with a rule or a heading.
- id: SPC-04
  title: Grouping Is Carried By Space
  ask: 'Related things sit closer together than unrelated ones: the gap between groups is at least one
    scale step larger than the gap inside a group. Equal spacing throughout leaves the reader to work
    out the structure from the words alone.'
  probe: true
  severity: blocker
  fix: Step the between-group gap up, or the within-group gap down, until the grouping is visible without
    reading.
- id: SPC-05
  title: Nothing Touches Its Container's Edge
  ask: Content keeps the container's padding from every edge. A field, a table row, or a heading flush
    against the panel border reads as clipped.
  probe: true
  severity: blocker
  fix: Add the padding to the container rather than margins to the first and last child.
- id: SPC-06
  title: The Last Child Has Space Beneath It
  ask: A stack's final element is not flush with the bottom of its container, and the page's last section
    is not flush with the viewport bottom. Both read as the content having been cut off.
  probe: true
  fix: Use container padding rather than child margins, so the bottom survives whatever renders last.
- id: SPC-07
  title: Label, Control, And Helper Use One Rhythm
  ask: The distance from a label to its control, and from a control to its helper or error text, is the
    same for every field in the deliverable. Two field groups with different internal spacing make a form
    look assembled rather than designed.
  probe: true
  when: form
  severity: blocker
  fix: Extract one field group component and render every field through it.
- id: SPC-08
  title: Section Rhythm Has Distinct Tiers
  ask: Spacing between components, between groups, and between page sections comes from clearly different
    steps - something like 16, 24, 32, 48 - not three values a few pixels apart. Tiers that nearly match
    read as inconsistency rather than hierarchy.
  probe: true
  fix: Collapse near-identical steps into one and space the remaining tiers apart.
- id: SPC-09
  title: Adjacent Borders Are Not Doubled
  ask: Where bordered blocks do sit flush by design - a list, a table, a segmented control - the shared
    edge is one line, not two. Collapse the border or drop it from one side.
  probe: true
  fix: Use border-collapse, a divide utility, or remove the border from one of the two touching sides.
- id: SPC-10
  title: Optional Blocks Do Not Leave Holes
  ask: A conditionally rendered block takes its gap with it when it goes. A gap that lives on the surviving
    sibling's margin leaves a hole where the optional block used to be.
  probe: true
  severity: blocker
  fix: Move the spacing to the container's gap so it disappears with the child.
- id: SPC-11
  title: The Spacing Capture Was Taken
  ask: The rendered spacing sweep ran over the deliverable. Every gate in this group judges an arrangement,
    and an arrangement is not in the source.
  probe: true
  when: renderable
  severity: blocker
  fix: Run scripts/code/spacing-probe.js in the page, then design-pass.py spacing-probe --file capture.json
- id: COH-01
  title: One Corner Radius Language
  ask: Radius values across the deliverable form a small named set, and every element of the same kind
    takes the same step. One page's table with square corners beside nine rounded ones is the canonical
    version of this, and it survives every per-page review because each page is internally consistent.
  probe: true
  severity: blocker
  fix: Move the outlier onto the scale's nearest step, or add the step to the scale if it is genuinely
    a new one.
- id: COH-02
  title: One Shadow Scale
  ask: Elevation comes from a small set of named shadows. A one-off shadow reads as a different surface
    at a different height, and nothing tells the reader why.
  probe: true
  severity: blocker
  fix: Replace the one-off with the nearest named elevation step.
- id: COH-03
  title: One Border Treatment
  ask: Border widths and colours are consistent for the same kind of boundary. A 2px border where the
    rest of the product uses a hairline makes one card look selected when it is not.
  probe: true
  fix: Bring the outlier onto the shared border token.
- id: COH-04
  title: One Motion Rhythm
  ask: Durations and easing curves come from the same small set everywhere. Three durations and one curve
    is a rhythm; nine durations and four curves is noise the reader feels without being able to name.
  probe: true
  fix: Move the outlying durations onto the motion tokens.
- id: COH-05
  title: One Easing Vocabulary
  ask: Every transition and animation references the named curves. A bespoke cubic-bezier in one file
    is a different physics for one element.
  probe: true
  fix: Replace the inline curve with the easing token.
- id: COH-06
  title: One Type Scale Across Files
  ask: Font sizes across the deliverable land on one scale. A 15px heading among 14 and 16 is the sort
    of thing nobody sees and everybody feels.
  probe: true
  severity: blocker
  fix: Round the outlier to the nearest step on the type scale.
- id: COH-07
  title: One Spacing Rhythm
  ask: Padding and gap values across files come from the same scale. A section on its own rhythm reads
    as pasted in.
  probe: true
  fix: Move the outlying values onto the spacing scale.
- id: COH-08
  title: One Font Stack
  ask: The same display, body, and mono families everywhere. A second sans-serif appearing in one file
    is usually a paste that nobody noticed.
  probe: true
  severity: blocker
  fix: Point the outlier at the font token.
- id: COH-09
  title: The Same Component Looks The Same Everywhere
  ask: Tables, cards, buttons, inputs, and modals carry the same radius, border, padding, and surface
    wherever they appear. Where two files style the same kind of element differently, one of them is wrong
    even though both look fine alone.
  probe: true
  severity: blocker
  fix: Extract the shared primitive, or bring the outlying definition onto the same tokens.
- id: COH-10
  title: One Definition Per Component
  ask: A component is defined once and imported, not re-implemented per page. Two Card components in one
    codebase drift the first time only one of them is touched.
  probe: true
  fix: Delete the duplicate and import the shared one.
- id: COH-11
  title: State Colours Mean One Thing
  ask: Danger, success, warning, and info map to the same tokens and the same vocabulary in every place
    they appear - a table cell, a badge, a toast, a detail panel. A status that is red in a list and amber
    in a panel is two products.
  probe: true
  severity: blocker
  fix: Map status to tone in one module and render every surface through it.
- id: COH-12
  title: One Density
  ask: Control heights and row heights are consistent across surfaces. A 32px control on one page and
    44px on the next changes how dense the product feels between clicks.
  probe: true
  fix: Move both onto one control height token, with the touch floor applied by media query rather than
    per page.
- id: COH-13
  title: One Icon Size And Weight
  ask: Icon sizes come from a token set and stroke weight is constant within a hierarchy level. Mixed
    20 and 24px icons in the same row is the sort of thing that reads as sloppiness without being identifiable
    as one.
  probe: true
  fix: Define icon size tokens and reference them.
- id: COH-14
  title: New Work Matches What Was Already There
  ask: Anything added in this run takes its radius, spacing, type, motion, and surfaces from what the
    project already does. Where the existing pattern is worse than the new one, the fix is to change both,
    not to leave two.
  probe: false
  when: always
  severity: blocker
  fix: Name the existing pattern you matched, or the sweep you did to move both onto the new one.
- id: COH-15
  title: Every File Was Compared Against The Others
  ask: The cohesion sweep ran over every file in scope, not a sample. The mismatch this group exists to
    catch is invisible from inside any one file.
  probe: true
  when: always
  severity: blocker
  fix: design-pass.py cohesion, then resolve the outliers it names.
- id: POL-01
  title: 'No transition: all'
  ask: 'Transitions name their properties. transition: all animates whatever happens to change, including
    layout properties, and costs frames for effects nobody asked for.'
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: css
  severity: blocker
  fix: 'Specify: transition: transform 200ms var(--ease-out), opacity 200ms var(--ease-out).'
  source: references/polish.md#review-checklist; slop gate 10
- id: POL-02
  title: Nothing Animates From scale(0)
  ask: Entrances start at scale(0.9) or higher with opacity. Nothing in the real world vanishes to a point
    and reappears from one.
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: motion
  severity: required
  fix: 'Start from scale(0.95) with opacity: 0.'
  source: references/polish.md#never-animate-from-scale0
- id: POL-03
  title: No ease-in On UI
  ask: ease-in starts slow, which delays movement at exactly the moment the user is watching. Entering
    and exiting use ease-out; on-screen movement uses ease-in-out; hover and colour use ease; constant
    motion uses linear.
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: motion
  severity: required
  fix: Switch to ease-out or the project's custom curve.
  source: references/polish.md#what-easing-should-it-use
- id: POL-04
  title: Custom Easing Curves, Defined As Tokens
  ask: 'The built-in CSS easings are too weak to read as intentional. Define --ease-out: cubic-bezier(0.23,
    1, 0.32, 1), --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1), and the drawer curve, and reference them.'
  probe: true
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Add the easing tokens to :root and point every transition at them.
  source: references/polish.md#what-easing-should-it-use
- id: POL-05
  title: No Overshoot Easing On UI State
  ask: Bouncy cubic-beziers belong to physical interactions — a dragged sheet, a pulled refresh. On a
    button, modal, or tooltip they read as a toy.
  probe: true
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Replace with the standard ease-out token on UI state changes.
  source: slop gate 12
- id: POL-06
  title: UI Motion Stays Under 300ms
  ask: Button press 100–160ms; tooltips and small popovers 125–200ms; dropdowns and selects 150–250ms;
    modals and drawers 200–500ms. Nothing else on the interface exceeds 300ms.
  probe: true
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Bring the duration into 150–250ms.
  source: references/polish.md#how-fast-should-it-be
- id: POL-07
  title: Only transform And opacity Animate
  ask: width, height, top, left, margin, and padding trigger layout and paint. transform and opacity run
    on the GPU. Position changes go through transform.
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: motion
  severity: blocker
  fix: Rewrite the animation onto transform/opacity; use scale or translate instead of size and position.
  source: references/polish.md#only-animate-transform-and-opacity; slop gate 14
- id: POL-08
  title: Keyboard-Initiated Actions Do Not Animate
  ask: Command palettes, shortcut-driven toggles, and anything a user hits a hundred times a day open
    with no animation at all. Animation there reads as lag.
  probe: false
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Remove the animation from the keyboard path; keep it on the mouse path only if it earns its place.
  source: references/polish.md#should-this-animate-at-all
- id: POL-09
  title: Every Animation Has A Stated Purpose
  ask: Spatial consistency, state indication, explanation, feedback, or preventing a jarring change. 'It
    looks cool' on something seen daily is not a purpose.
  probe: false
  kinds:
  - web-ui
  - component
  - slides
  when: motion
  severity: required
  fix: Name the purpose per animation, or delete it.
  source: references/polish.md#what-is-the-purpose
- id: POL-10
  title: Popovers Are Origin-Aware
  ask: A popover scales from its trigger, not from its own centre. Radix and Base UI expose the transform-origin
    variable; use it. Modals are exempt and stay centred.
  probe: false
  kinds:
  - web-ui
  - component
  when: modal
  severity: required
  fix: Set transform-origin to var(--radix-popover-content-transform-origin) or the equivalent.
  source: references/polish.md#make-popovers-origin-aware; slop checklist
- id: POL-11
  title: Exit Is Faster Than Enter
  ask: Exit runs at roughly 60–70% of the enter duration. Matching them makes dismissal feel like the
    interface is arguing with the user.
  probe: false
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Shorten the exit transition.
  source: references/polish.md#asymmetric-enterexit-timing
- id: POL-12
  title: Lists Stagger, They Do Not Arrive At Once
  ask: Grid and list entrances stagger 30–80ms per item. Everything appearing on the same frame reads
    as a page repaint, not an arrival.
  probe: false
  kinds:
  - web-ui
  - component
  when: motion
  severity: advisory
  fix: Add a per-index delay of 30–80ms, capped so long lists do not crawl.
  source: references/polish.md#stagger-animations
- id: POL-13
  title: CSS Transitions For Interruptible UI
  ask: Rapidly-triggered elements use transitions, not keyframes — a keyframe animation restarted mid-flight
    snaps. Predetermined motion goes in CSS (off main thread); dynamic interruptible motion goes in JS.
  probe: false
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Convert the keyframe animation on the hot element to a transition.
  source: references/polish.md#use-css-transitions-over-keyframes-for-interruptible-ui
- id: POL-14
  title: Framer Motion Uses Full Transform Strings
  ask: 'The x, y, and scale shorthands are not hardware accelerated — they run on the main thread and
    drop frames under load. animate={{ transform: ''translateX(100px)'' }} does not.'
  probe: true
  kinds:
  - web-ui
  - component
  when: framer
  severity: required
  fix: Use the full transform string.
  source: references/polish.md#framer-motion-hardware-acceleration-caveat
- id: POL-15
  title: Reduced Motion Has A Real Fallback
  ask: 'Every transform and keyframe has an answer under @media (prefers-reduced-motion: reduce). Reduced
    motion means fewer and gentler, not none — keep opacity and colour transitions that aid comprehension,
    drop movement.'
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: motion
  severity: blocker
  fix: Add the reduced-motion block; strip transforms, keep fades.
  source: references/polish.md#prefers-reduced-motion; slop gate 27
- id: POL-16
  title: Unknown, Empty, And Failed Are Three Different States
  ask: Data starts as null (unknown), not [] (empty). The empty state waits until the server has actually
    answered. A failed request shows a failure, never a skeleton that shimmers forever.
  probe: false
  kinds:
  - web-ui
  - component
  when: fetch
  severity: blocker
  fix: Initialise to null, branch on unknown vs empty vs failed, and give the failure its own message
    and retry.
  source: references/polish.md#keep-three-states-apart
- id: POL-17
  title: One Skeleton Primitive, Shaped Like Its Content
  ask: A single Skeleton primitive and one Loading composition, reused. Each placeholder matches the real
    box — chart height, row height — so nothing shifts when it resolves. Per-screen bespoke skeletons
    are how a codebase ends up with nine.
  probe: false
  kinds:
  - web-ui
  - component
  when: fetch
  severity: required
  fix: Extract the shared primitive and match the placeholder box to the real one.
  source: references/polish.md#skeletons-are-uniform-and-shaped-like-their-content
- id: POL-18
  title: Content Animates In When Its Skeleton Resolves
  ask: Content does not snap in. It animates once, with the same entrance used for page changes.
  probe: false
  kinds:
  - web-ui
  - component
  when: fetch
  severity: required
  fix: Apply the shared entrance to the resolved content, once.
  source: references/polish.md#content-animates-in-when-its-skeleton-resolves
- id: POL-19
  title: Loading Shows After 300ms, Not Before
  ask: Work under 300ms shows nothing — a flashed spinner is worse than a brief wait. Past 300ms, show
    the skeleton. Past a second, show progress.
  probe: false
  kinds:
  - web-ui
  - component
  when: fetch
  severity: required
  fix: Delay the loading indicator by 300ms.
  source: references/intelligence.md#7-animation (loading-states)
- id: POL-20
  title: No Toast For A Visible Success
  ask: Toasts are for failures and for effects the user cannot see. Confirming something they are already
    looking at is noise.
  probe: false
  kinds:
  - web-ui
  - component
  when: toast
  severity: required
  fix: Delete the success toast where the effect is on screen; keep it for background work.
  source: slop gate 16
- id: POL-21
  title: Tooltip Delays Differ For Hover And Focus
  ask: Hover delays 800–1000ms; focus opens at 0ms. Once one tooltip is open, subsequent ones in the same
    group skip the delay and the animation.
  probe: false
  kinds:
  - web-ui
  - component
  when: tooltip
  severity: required
  fix: Split the two delays and add the skip-delay window.
  source: slop gate 17; references/polish.md#tooltips-skip-delay-on-subsequent-hovers
- id: POL-22
  title: Auto-Rotating Content Pauses On Hover And Focus
  ask: Carousels, rotating banners, and cycling stats stop when the pointer or keyboard reaches them.
    WCAG 2.2.2.
  probe: false
  kinds:
  - web-ui
  - component
  when: carousel
  severity: blocker
  fix: Pause on mouseenter and focusin; resume on leave and blur.
  source: slop gate 18
- id: POL-23
  title: Navigation Motion Follows Its Own Rules
  ask: Nav bars, menus, dropdowns, sidebars, hamburger morphs, and active indicators use the per-element
    timings, stagger, and easing in references/navigation-menus.md rather than the generic transition.
  probe: false
  kinds:
  - web-ui
  when: nav
  severity: required
  fix: Read navigation-menus.md and apply the timings for the element in question.
  source: references/navigation-menus.md
- id: POL-24
  title: Motion Is Interruptible And Never Blocks Input
  ask: A tap or gesture cancels an in-flight animation immediately, and the interface stays interactive
    throughout. An animation the user has to wait out is a modal nobody asked for.
  probe: false
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Use transitions or interruptible springs; never gate input on animation completion.
  source: references/intelligence.md#7-animation (interruptible, no-blocking-animation)
- id: POL-25
  title: At Most Two Elements Animate Per View
  ask: One or two key elements carry the motion in any given view. Everything moving at once is a screensaver.
  probe: false
  kinds:
  - web-ui
  - component
  - slides
  when: motion
  severity: advisory
  fix: Pick the two that matter and still the rest.
  source: references/intelligence.md#7-animation (excessive-motion)
- id: SKL-01
  title: One Component Renders Both States
  ask: The placeholder and the content it stands in for come from the same component, branching on the
    loading state. A separately authored skeleton is correct on the day it is written and drifts from
    that day onward - the content gains a row, the placeholder does not, and nothing points it out.
  probe: false
  severity: blocker
  fix: Move the placeholder into the component that renders the real thing, so the same layout code produces
    both.
- id: SKL-02
  title: Placeholder Box Matches The Content Box
  ask: Each placeholder's rendered width and height match the box that replaces it, within 2px or 1%,
    whichever is larger. Measured in the browser at the same viewport, not estimated from the source.
  probe: true
  severity: blocker
  fix: Capture both states with scripts/code/skeleton-probe.js, then size the placeholder from the same
    tokens the content uses rather than a chosen height.
- id: SKL-03
  title: Placeholder Sits Where The Content Sits
  ask: Each placeholder's top-left lands within 2px of its content's, so nothing slides sideways or upward
    as the request returns.
  probe: true
  severity: blocker
  fix: Give the placeholder the content's own wrapper, padding, and margins instead of a substitute container.
- id: SKL-04
  title: Same Container, Same Layout
  ask: The placeholder renders inside the same grid or flex container as the content, with the same template,
    gap, alignment, and direction. A three-column grid that loads as a stack rearranges the page in front
    of the reader.
  probe: true
  severity: blocker
  fix: Render the placeholders as children of the real container rather than wrapping them in one of their
    own.
- id: SKL-05
  title: Placeholder Count Matches What Arrives
  ask: The number of placeholders equals the number of items that land, or the page-size the request asks
    for. Where the count is genuinely unknown, the placeholder block is sized to the viewport and the
    arriving list extends it downward - never a fixed three that becomes twenty.
  probe: true
  fix: Drive the placeholder count from the same page-size constant the request uses.
- id: SKL-06
  title: Text Placeholders Match Line Count And Line Height
  ask: A paragraph placeholder has as many bars as the text has lines, each the height of the real line
    box, spaced by the same line-height. A single tall block where three lines will land is a different
    shape arriving.
  probe: false
  fix: Set the bar height from the line-height token and repeat it per expected line.
- id: SKL-07
  title: The Last Text Line Is Short
  ask: Real paragraphs end mid-line. A stack of equal-width bars reads as a barcode; the closing bar runs
    40-70% width so the block reads as text before it is text.
  probe: false
  severity: advisory
  fix: Shorten the final bar in the group.
- id: SKL-08
  title: Radius And Shape Match
  ask: Corner radius, circularity, and border weight match what arrives. A square placeholder that resolves
    into a round avatar is a visible pop even when the box is the right size.
  probe: true
  fix: Take the radius from the same token the content uses.
- id: SKL-09
  title: Image Placeholders Hold The Aspect Ratio
  ask: A placeholder standing in for an image declares the image's aspect-ratio, so the box is right before
    the file's dimensions are known.
  probe: true
  severity: blocker
  fix: Set aspect-ratio on the placeholder from the same value the image element declares.
- id: SKL-10
  title: Padding And Margins Are The Content's
  ask: The placeholder inherits the content's own spacing rather than approximating it. Padding that differs
    by a step moves every row below it when the data lands.
  probe: false
  fix: Apply the content's spacing tokens to the placeholder, or render it inside the content's own padded
    wrapper.
- id: SKL-11
  title: Responsive Behaviour Matches At Every Breakpoint
  ask: The placeholder reflows at the same widths the content does, checked at 375, 768, and 1280. A placeholder
    that keeps three columns where the content collapses to one is only correct on a desktop.
  probe: false
  severity: blocker
  fix: Let the shared container's media queries drive both states, then re-capture at each width.
- id: SKL-12
  title: Placeholder Colours Come From Tokens
  ask: The placeholder fill and its highlight are named tokens resolving in dark, light, and gray. A hardcoded
    pale grey is invisible on one theme and glaring on another.
  probe: true
  severity: blocker
  fix: Define the placeholder fill and highlight as tokens in all three theme blocks and reference them.
- id: SKL-13
  title: Shimmer Animates Transform Or Opacity Only
  ask: The sweep moves a translated overlay or fades opacity. Animating background-position, width, or
    left runs paint or layout on every frame of something the reader is already waiting through.
  probe: true
  fix: Replace the animated background-position with a translated gradient overlay, or fade the fill.
- id: SKL-14
  title: Shimmer Stops Under Reduced Motion
  ask: Under prefers-reduced-motion the sweep stops and the placeholder holds a static fill. It still
    reads as pending; it just stops moving.
  probe: true
  severity: blocker
  fix: Add the reduced-motion block that sets the placeholder animation to none.
- id: SKL-15
  title: Placeholders Are Hidden From Screen Readers
  ask: The placeholder block carries aria-hidden or sits inside an aria-busy region, and the wait is announced
    once through a live region. Without it a screen reader recites a row of empty boxes.
  probe: true
  severity: blocker
  fix: Add aria-hidden="true" to the placeholders and aria-busy plus a polite live region to the container.
- id: SKL-16
  title: Nothing Shifts When It Resolves
  ask: The layout shift from placeholder to content is zero. Everything below the block stays where it
    was - the whole reason a placeholder exists rather than a spinner.
  probe: true
  severity: blocker
  fix: Fix whichever of SKL-02 through SKL-10 the capture shows moving, then re-capture.
- id: SKL-17
  title: One Placeholder Primitive, Not One Per Screen
  ask: A single Skeleton primitive and one Loading composition, reused. Bespoke placeholders per screen
    is how a codebase ends up with nine of them, each wrong in its own way.
  probe: true
  fix: Extract the shared primitive and compose the per-screen shapes from it.
- id: SKL-18
  title: The Placeholder Never Outlives The Request
  ask: A failed or timed-out request replaces the placeholder with the failure and a way to retry. A placeholder
    that can shimmer forever is a loading state standing in for an error.
  probe: false
  severity: blocker
  fix: Branch the failure out of the loading state and give it its own message and retry.
- id: SKL-19
  title: Every Loading Path Has A Placeholder
  ask: Anything that fetches shows a placeholder shaped like what it is fetching. Not a spinner, not an
    empty container that springs open, not a bare page that fills in. A request the reader waits on without
    a placeholder is the default this whole group exists to replace.
  probe: true
  severity: blocker
  fix: Add the placeholder branch to the component that owns the request, built from the shared primitive.
- id: SKL-20
  title: Deferred And Lazy Content Reserves Its Box
  ask: Content that mounts late - a dynamically imported section, a below-fold block, anything behind
    Suspense or an intersection observer - holds its box before it arrives. Nothing is loading yet from
    the reader's side; the page still must not jump when it does.
  probe: false
  when: html
  severity: blocker
  fix: Give the deferred boundary a placeholder of the mounted component's size rather than a null fallback.
- id: SKL-21
  title: Late-Measuring Widgets Reserve Their Box
  ask: Charts, maps, editors, video players, and embeds measure their container on mount and paint a frame
    later. Each one gets a reserved box at its final height, so the section does not grow under the reader
    after the page looks settled.
  probe: true
  when: html
  severity: blocker
  fix: Wrap the widget in a container with an explicit height or aspect-ratio, and show the placeholder
    inside it until the widget paints.
- id: SKL-22
  title: Appending Pages Show Placeholder Rows
  ask: A list fetching its next page shows placeholder rows at the tail, in the row's own shape. A spinner
    under the list tells the reader something is happening but not what is coming.
  probe: false
  when: list
  fix: Append the placeholder rows to the same list while the next page is in flight.
- id: SKL-23
  title: Route And Tab Changes Keep The Frame
  ask: Switching route, tab, or filter holds the frame and fills it with placeholders rather than collapsing
    to nothing and rebuilding. This applies even when the data is already cached and nothing is actually
    loading - the frame staying put is what makes the change read as a change rather than a reload.
  probe: false
  when: html
  fix: Keep the container mounted across the switch and swap its contents, placeholders first.
- id: SKL-24
  title: Images Hold A Placeholder Until They Decode
  ask: An image box carries a placeholder fill - the tokened surface, a blur hash, or a dominant colour
    - from first paint until the file decodes. A reserved but empty box is a hole in the layout for as
    long as the network takes.
  probe: true
  when: image
  fix: Set a token background on the image element or its wrapper, so the box is filled before the file
    lands.
- id: SKL-25
  title: A View's Placeholders Resolve Together
  ask: Every placeholder in one view flips on one state change, from one loading boundary. Where each
    block waits on its own request, the top one lands first and everything below it jumps, then the next
    lands and it jumps again - the reader is being moved around while trying to read the part that already
    arrived. Hold the view until its data is in, or give each block a box so exact that its arrival moves
    nothing.
  probe: true
  severity: blocker
  fix: Gather the view's requests into one await or one Suspense boundary, so the placeholders come and
    go as a set.
- id: SKL-26
  title: Nothing Already On Screen Moves When The Rest Lands
  ask: 'Measured across the whole resolution, not per block: the total shift from first placeholder to
    last arrival is zero. A block resolving early and shrinking pulls everything below it upward, which
    is the same defect as a late one growing - and neither shows up when each placeholder is checked on
    its own.'
  probe: true
  severity: blocker
  fix: Run skeletonProbe.watch() through the load, then fix whichever block reports movement - usually
    one whose placeholder is not the height of what replaces it.
- id: SKL-27
  title: Content Animates In, It Does Not Appear
  ask: When a placeholder resolves, what replaces it animates in - the same entrance used for page changes,
    once, on the block rather than on each of its children. Content that simply appears reads as a repaint
    rather than an arrival, and it is the moment the reader is looking straight at.
  probe: true
  severity: blocker
  fix: Apply the shared entrance to the resolved block, keyed so it runs once, and stop it under reduced
    motion.
- id: SLP-00
  title: Pre-Emit Critique Scored And Stamped
  ask: Before the gate sweep, score the planned output 1-5 on Philosophy, Hierarchy, Execution, Specificity,
    Restraint, and Variety. Anything under 3 triggers a revision pass first. Stamp the six scores at the
    top of the file.
  probe: true
  kinds:
  - web-ui
  - component
  when: macrostructure
  severity: blocker
  fix: 'Score the six axes, revise anything under 3, then stamp: /* pre-emit critique: P5 H4 E5 S4 R5
    V5 */'
  source: references/hallmark/references/slop-test.md#pre-emit-self-critique
- id: SLP-01
  title: Display Font Is Not A Default
  ask: The display font is not Inter, Roboto, Open Sans, Poppins, Lato, or a system default, and it is
    not a serif reached for because the brief felt creative. Serif is justified only when the brief names
    one, or when the family is genuinely editorial, luxury, publication, manuscript, heritage, or vintage
    and the choice of that face can be argued for that brand. Fraunces and Instrument Serif are banned
    outright as defaults and are held by TST-33.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: blocker
  fix: Pick a display face with a point of view from the theme's pairing. If it is a serif, record why
    that face fits this brand.
  source: slop gate 1
- id: SLP-02
  title: No Purple-To-Blue Gradient
  ask: 'No purple-to-blue or cyan-to-magenta gradient anywhere, including a background-clip: text gradient
    headline. No genre allows gradient text.'
  probe: true
  kinds:
  - web-ui
  - component
  - banner
  - social
  - slides
  when: css
  severity: blocker
  fix: Solid colour on the headline; move any gradient to a background, one accent hue only.
  source: slop gate 2
- id: SLP-03
  title: No Three-Column Icon-Above-Heading Card Grid
  ask: The 3-equal-column card grid with icon-above-heading tiles is the single most recognisable generated
    layout.
  probe: false
  kinds:
  - web-ui
  when: html
  severity: blocker
  fix: Pick a different feature archetype from the component cookbook - bento, spec sheet, step sequence,
    sticky stack.
  source: slop gate 3
- id: SLP-04
  title: No Card Inside A Card
  ask: Nested cards double the border, double the padding, and halve the hierarchy.
  probe: false
  kinds:
  - web-ui
  - component
  when: html
  severity: required
  fix: Flatten to one surface and separate with space or a rule.
  source: slop gate 4
- id: SLP-05
  title: No Thick Coloured Side-Stripe On Cards
  ask: The thick coloured left or right border on a card is a template signature.
  probe: false
  kinds:
  - web-ui
  - component
  when: css
  severity: required
  fix: Drop the stripe; carry the category in a label or the surface tint.
  source: slop gate 5
- id: SLP-06
  title: Hero Is Not Centred-Everything
  ask: 'Fail if the hero is min-height: 100vh with everything centred, or if eyebrow, title, lede, and
    CTA all sit on the same centred vertical axis. At most two centred elements; the eyebrow or CTA sits
    off-axis.'
  probe: false
  kinds:
  - web-ui
  when: hero
  severity: blocker
  fix: 'Break the axis: margin-align the eyebrow, right-flush the CTA, or anchor to a numeral.'
  source: slop gate 6
- id: SLP-07
  title: No Pure Black Or Pure White Base
  ask: '#000 and #fff as base colours read as unconsidered. Modern-minimal alone may use pure #fff paper.'
  probe: true
  kinds:
  - web-ui
  - component
  - slides
  when: css
  severity: required
  fix: Tint the base toward the anchor hue - minimum 0.005 chroma.
  source: slop gate 7
- id: SLP-08
  title: Structure Is Not Reused
  ask: 'Not the generic AI template (hero, 3 features, CTA, footer), and not the same structural fingerprint
    as a previous output in this project. Check .macrostructure/log.json or the CSS macrostructure stamp.
    The countable half of this is TST-11 and TST-12: no more than two consecutive image-and-text splits,
    and at least four layout families across eight sections.'
  probe: false
  kinds:
  - web-ui
  when: macrostructure
  severity: blocker
  fix: Pick a macrostructure that differs from the last build in this project, and settle TST-11 and TST-12
    as the evidence that the sections themselves differ.
  source: slop gate 8
- id: SLP-09
  title: Sections Are Separated By More Than Whitespace
  ask: Equal whitespace between every section, no rule, no ornament, no colour shift, identical rhythm
    throughout - the page reads as a list of boxes.
  probe: false
  kinds:
  - web-ui
  when: html
  severity: required
  fix: Vary section rhythm; introduce a rule, a surface shift, or a full-bleed break.
  source: slop gate 9
- id: SLP-10
  title: 'No transition: all'
  ask: Named properties only. Duplicate of POL-01, checked here for macrostructure builds.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: blocker
  fix: Name the properties.
  source: slop gate 10
- id: SLP-11
  title: No Uniform Hover-Scale
  ask: The same hover-scale across unrelated elements.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: required
  fix: Differentiate the hover per element type.
  source: slop gate 11
- id: SLP-12
  title: No Overshoot Easing On UI State
  ask: Bouncy cubic-beziers on buttons, modals, or tooltips. Reserve overshoot for physical interactions.
  probe: true
  kinds:
  - web-ui
  - component
  when: motion
  severity: required
  fix: Use the standard ease-out token.
  source: slop gate 12
- id: SLP-13
  title: One Hover Effect Per Element
  ask: Translate plus scale plus shadow plus colour plus rotate on the same hover.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: required
  fix: Keep one effect.
  source: slop gate 13
- id: SLP-14
  title: No Layout Property Animated
  ask: width, height, top, left, margin, padding.
  probe: true
  kinds:
  - web-ui
  - component
  when: motion
  severity: blocker
  fix: Move to transform.
  source: slop gate 14
- id: SLP-15
  title: Focus Ring Does Not Fade In
  ask: Focus rings appear instantly.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: required
  fix: Exclude the ring properties from the transition.
  source: slop gate 15
- id: SLP-16
  title: No Toast For A Visible Success
  ask: Silent success is taste; toasts are for failures and invisible effects.
  probe: false
  kinds:
  - web-ui
  - component
  when: toast
  severity: required
  fix: Delete the toast.
  source: slop gate 16
- id: SLP-17
  title: Tooltip Hover And Focus Delays Differ
  ask: Hover 800-1000ms; focus 0ms.
  probe: false
  kinds:
  - web-ui
  - component
  when: tooltip
  severity: required
  fix: Split the delays.
  source: slop gate 17
- id: SLP-18
  title: Auto-Rotating Content Pauses
  ask: Pause on hover and focus. WCAG 2.2.2.
  probe: false
  kinds:
  - web-ui
  when: carousel
  severity: blocker
  fix: Pause on mouseenter and focusin.
  source: slop gate 18
- id: SLP-19
  title: No Placeholder Names Or Startup Cliches
  ask: No Jane Doe, John Smith, Acme, Nexus, Seamless, or Unleash.
  probe: true
  kinds:
  - web-ui
  - slides
  - banner
  - social
  when: copy
  severity: blocker
  fix: Use the real name, or a name that belongs to the brief.
  source: slop gate 19
- id: SLP-20
  title: Macrostructure Stamp Present
  ask: 'The /* macrostructure: <name> ... */ stamp sits at the top of the CSS.'
  probe: true
  kinds:
  - web-ui
  when: macrostructure
  severity: required
  fix: Add the stamp with the macrostructure, theme, and knob deltas.
  source: slop gate 20
- id: SLP-21
  title: No Specimen Fall-Through
  ask: Specimen (numbered left-margin labels, huge serif, asymmetric spans, typographic-only CTA) is not
    the default. It is picked only when the brief signals editorial, foundry, or specimen energy.
  probe: false
  kinds:
  - web-ui
  when: macrostructure
  severity: required
  fix: Re-pick the macrostructure from the brief's genre.
  source: slop gate 21
- id: SLP-22
  title: Neutrals Are Tinted, Not Zero-Chroma
  ask: Every neutral and surface carries at least 0.005 chroma toward the anchor hue. Pure greys read
    flat. Modern-minimal is exempt.
  probe: false
  kinds:
  - web-ui
  - component
  when: css
  severity: required
  fix: Tint the neutrals toward the accent hue.
  source: slop gate 22
- id: SLP-23
  title: Accent Covers Under 5% Of The Viewport
  ask: 'Count by area: solid fills, large headings in accent, full-bleed accent backgrounds. Accent is
    for emphasis, not filling. Atmospheric allows accent blooms to 20%.'
  probe: false
  kinds:
  - web-ui
  - banner
  - social
  - slides
  when: css
  severity: required
  fix: Retreat the accent to the elements that need to be found first.
  source: slop gate 23
- id: SLP-24
  title: Spacing Is On The Named Scale
  ask: 'Every padding, gap, and margin is a named step (--space-3xs through --space-5xl, multiples of
    4px). padding: 17px is a tell.'
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: required
  fix: Round to the scale.
  source: slop gate 24
- id: SLP-25
  title: Prose Measure Is 45-75ch
  ask: Under 45ch is choppy; over 75ch loses the eye.
  probe: true
  kinds:
  - web-ui
  - slides
  when: css
  severity: required
  fix: Set max-width in ch within the range.
  source: slop gate 25
- id: SLP-26
  title: Every Interactive Element Has Five States
  ask: Default, hover, focus-visible, active, and disabled are all present in code. Two states is not
    a state system.
  probe: true
  kinds:
  - web-ui
  - component
  when: interactive
  severity: blocker
  fix: Add the missing states to the control primitive.
  source: slop gate 26
- id: SLP-27
  title: Every Motion Has A Reduced-Motion Fallback
  ask: 'No transform or keyframe is left uncovered by @media (prefers-reduced-motion: reduce).'
  probe: true
  kinds:
  - web-ui
  - component
  when: motion
  severity: blocker
  fix: Add the reduced-motion block.
  source: slop gate 27
- id: SLP-28
  title: Hero Video Is Not An LCP Killer
  ask: No autoplay with sound, no missing poster, no missing fetchpriority="high", no loading="lazy" on
    the LCP element.
  probe: false
  kinds:
  - web-ui
  when: video
  severity: required
  fix: Add poster and fetchpriority; mute autoplay; drop lazy from the LCP element.
  source: slop gate 28
- id: SLP-29
  title: Abstract Background Stays Within Budget
  ask: One accent colour, under 5% footprint, no animating mesh gradient across the page. Aurora blobs
    fail. Atmospheric allows two warm radial blooms at 20-30%, fixed, unanimated.
  probe: false
  kinds:
  - web-ui
  when: css
  severity: required
  fix: Cut to one bloom within budget, or remove it.
  source: slop gate 29
- id: SLP-30
  title: One Icon Library, No Emoji Icons
  ask: No mixing Material with Heroicons with Lucide, and no emoji glyph as a feature, value-prop, step,
    or pricing-tier icon.
  probe: true
  kinds:
  - web-ui
  - slides
  when: html
  severity: blocker
  fix: Pick one library, or build the SVG, or drop the icon and lead with type.
  source: slop gate 30
- id: SLP-31
  title: Illustration Is Not Reflexively Lottie
  ask: A hand-built SVG or pure-CSS shape comes first; Lottie is the last resort.
  probe: false
  kinds:
  - web-ui
  when: html
  severity: advisory
  fix: Build the shape, or use a licensed illustration source from assets.md.
  source: slop gate 31
- id: SLP-32
  title: Repeated Archetype Turns A Variation Knob
  ask: Reusing an archetype from a previous build in the project requires at least one different variation
    knob, stated in the stamp. Two bento grids with identical knobs are the same bento.
  probe: false
  kinds:
  - web-ui
  when: macrostructure
  severity: required
  fix: Change a knob and record the delta in the stamp.
  source: slop gate 32
- id: SLP-33
  title: Decorative SVG And Canvas Are Labelled Or Hidden
  ask: Every visual-only svg, custom-art div, canvas, or decorative figure carries aria-label or aria-hidden="true".
  probe: true
  kinds:
  - web-ui
  - component
  when: svg
  severity: blocker
  fix: Add aria-hidden="true" to decoration, aria-label to anything meaningful.
  source: slop gate 33
- id: SLP-34
  title: No Horizontal Scroll, 320px To 1920px
  ask: 'Drag the width across the range; a horizontal scrollbar at any width fails. The fix is overflow-x:
    clip on both html and body - clip, not hidden, which preserves sticky and fixed descendants. Required
    on every emitted page, not only when scroll is observed.'
  probe: true
  kinds:
  - web-ui
  when: css
  severity: blocker
  fix: 'Set overflow-x: clip on html and body, then find what is overflowing.'
  source: slop gate 34
- id: SLP-35
  title: Text Decoration Sits Where It Should
  ask: A highlighter band sits behind the x-height, not at the baseline. Underlines are 1-2px, offset
    1-2px, never 5+. Decorative strokes stay inside the accent budget. The check is visual.
  probe: false
  kinds:
  - web-ui
  when: css
  severity: required
  fix: Re-position the gradient stops so the band lands on the x-height.
  source: slop gate 35
- id: SLP-36
  title: Interactive Bars Are Vertically Centred
  ask: 'Nav, toolbar, command bar, hero CTA row, and footer link strip declare align-items: center, with
    line-height: 1 on items with intrinsic height. Default flex stretch makes a button taller than its
    sibling text.'
  probe: false
  kinds:
  - web-ui
  when: nav
  severity: required
  fix: 'Set align-items: center on the row and line-height: 1 on its items.'
  source: slop gate 36
- id: SLP-37
  title: At Most Three Font Families
  ask: Display, body, and at most one outlier. Same family at different weights counts once. Mono counts
    as a family if used outside code.
  probe: true
  kinds:
  - web-ui
  - slides
  - banner
  - social
  when: css
  severity: required
  fix: Drop one back to the body or display face.
  source: slop gate 37
- id: SLP-38
  title: Outlier Face Used In At Most Two Slots
  ask: Wordmark plus hero stat, or wordmark plus masthead, or hero stat plus pull quote. Three slots means
    it is now a third body font.
  probe: false
  kinds:
  - web-ui
  when: css
  severity: required
  fix: Collapse the third use back to the body face.
  source: slop gate 38
- id: SLP-38a
  title: No Italic Headings Or Display Type
  ask: 'No font-style: italic on h1-h6, a title class, a wordmark, a stat figure, or a footer statement
    - and no em or i inside a heading. The single italicised emphasis word in an upright headline is a
    top AI tell. Emphasis comes from weight, accent colour, or a drawn underline. Italic survives only
    as body-copy emphasis.'
  probe: true
  kinds:
  - web-ui
  - slides
  - banner
  - social
  when: css
  severity: blocker
  fix: 'Set font-style: normal on the heading and carry emphasis another way.'
  source: slop gate 38a
- id: SLP-39
  title: Input Fields Handle Every State
  ask: 'Fail on any of five: border-width shifts between states; focus ring built from border instead
    of outline (must be outline: 2px with outline-offset: 1px, reserved transparent at rest); input height
    differs from adjacent button height (share one 44px floor); helper-text slot collapses when empty
    (reserve min-height: 1lh); disabled signalled by opacity alone (needs opacity, cursor: not-allowed,
    and the native disabled attribute).'
  probe: false
  kinds:
  - web-ui
  - component
  when: form
  severity: blocker
  fix: Work the five sub-checks one at a time against interaction-and-states.md.
  source: slop gate 39
- id: SLP-40
  title: Contrast Thresholds Met Against Computed Backgrounds
  ask: 'Body text (under 24px regular or under 18px bold) needs 4.5:1 or APCA Lc 60. Large text, icons,
    and focus rings need 3:1 or Lc 45. Pair every colour declaration with its effective background. Most-missed:
    text in a card that switched surface, muted on tinted, a focus ring that clears the element but not
    the page.'
  probe: false
  kinds:
  - web-ui
  - component
  - slides
  when: css
  severity: blocker
  fix: Compute each pair and fix the failures.
  source: slop gate 40
- id: SLP-41
  title: The Three Contrast Failures That Ship Most
  ask: 'Fail on any: button text within 5% lightness and 0.05 chroma of its fill (the black-on-black bug);
    --color-accent-ink missing, unverified, or unapplied wherever accent fills a surface carrying text;
    a section darker than 50% lightness that does not swap its text colour in the same rule.'
  probe: false
  kinds:
  - web-ui
  - component
  when: css
  severity: blocker
  fix: Define and apply the ink token for every filled surface; swap text colour in the same rule that
    darkens a section.
  source: slop gate 41
- id: SLP-42
  title: Nav Is Not The AI Default
  ask: 'Wordmark left plus three to eight inline links plus one button at the trailing edge, on a light
    opaque surface with a 1px hairline and nothing else, is the shape the reference sites are not. A bar
    earns its shape through surface polish and through depth, and depth means a panel: a longer row of
    flat links is a longer link list. Whether the bar''s shape was chosen at all is NAV-11 and NAV-12,
    and whether it opens anything is NAV-14.'
  probe: true
  kinds:
  - web-ui
  - component
  when: nav
  severity: blocker
  fix: Give the bar a see-through surface (drop the token's alpha below 0.9 and pair it with backdrop-blur)
    or wire a scroll-state swap that darkens it over content, or move the surface to a distinctive dark
    ground.
  source: references/navigation-sites.md
- id: SLP-43
  title: Footer Is Not The AI Default
  ask: Four columns of links (Product, Company, Resources, Legal) plus a social row plus tiny copyright
    under a hairline fails unless the page is a genuine docs root or hub. Default to Ft1, Ft2, Ft4, Ft5,
    Ft6, Ft7, or Ft8. The mechanical half is FTR-01 and FTR-02, which require the archetype to be declared
    and refuse the index grid.
  probe: false
  kinds:
  - web-ui
  when: footer
  severity: required
  fix: Pick a footer archetype that closes the page rather than listing an absent sitemap.
  source: slop gate 43
- id: SLP-44
  title: Hero Sits Into The Page And Fits The Fold
  ask: 'padding-block-end is at least 1.3x padding-block-start, and at 1280x800 the eyebrow, headline,
    lede, primary CTA, and any hero visual''s focal point are all visible without scrolling. Usual culprits:
    oversized display clamp, loose display line-height, a three-line lede, bloated padding. The measured
    form of this is TST-01 through TST-04, which count the headline''s lines, the lede''s words, the top
    padding, and the hero''s text elements from the rendered page.'
  probe: false
  kinds:
  - web-ui
  when: hero
  severity: blocker
  fix: Pull the clamp max down, set display line-height 1.0-1.1, hold the lede to two lines, trim padding,
    then take a layout capture so TST-01 through TST-04 answer from measurement.
  source: slop gate 44
- id: SLP-45
  title: Decoration Has A Semantic Anchor
  ask: A cursor, scanline, gradient blob, abstract shape, ornament, badge, or sticker in the hero needs
    a reason in the content - a cursor inside a typed command, a numeral that names an issue or version,
    a stamp that names a date. A floating 42 with no edition meaning is slop.
  probe: false
  kinds:
  - web-ui
  when: hero
  severity: required
  fix: Anchor it to the content or remove it.
  source: slop gate 45
- id: SLP-46
  title: No Invented Metric
  ask: 'No quantitative claim the user did not supply - no 10x faster, no trusted by 50,000+ teams, no
    99.9% uptime, no +47% conversion. Same for testimonials, logos, and case-study counts. And a stat
    is never the hero''s sole headline: pair a lead figure with a line that says what it means.'
  probe: true
  kinds:
  - web-ui
  - slides
  - banner
  - social
  when: copy
  severity: blocker
  fix: Replace with an em dash and a labelled grey block, ask the user for the number, or rebuild the
    section without the proof slot.
  source: slop gate 46
- id: SLP-47
  title: No Re-Drawn UI Chrome
  ask: No hand-built browser bar with a URL pill and traffic-light dots, no fake phone frame, no fake
    code-block window, no fake terminal, no fake IDE chrome. The user's environment already supplies real
    chrome.
  probe: false
  kinds:
  - web-ui
  - slides
  - social
  when: html
  severity: blocker
  fix: Use a real screenshot in a figure with at most a hairline border, or omit the chrome.
  source: slop gate 47
- id: SLP-48
  title: No Mid-Render Token Improvisation
  ask: No colour value or font-family declaration outside the token block. Every colour and font references
    a named token. Inline oklch or a one-off hex means the model picked the theme and then freestyled.
  probe: true
  kinds:
  - web-ui
  - component
  when: css
  severity: blocker
  fix: Lift it into the token block as a named variable.
  source: slop gate 48
- id: SLP-49
  title: Clickable Text Never Wraps To Two Lines
  ask: No button label, nav link, footer link, tab label, breadcrumb, or CTA wraps at any width from 320px
    to 1920px. Two-line clickable text reads as a styling bug. A primary CTA label runs to three words
    at most, ideally one or two, and a CTA that wraps at desktop is a label that was never cut rather
    than a button that needs constraining.
  probe: false
  kinds:
  - web-ui
  when: css
  severity: blocker
  fix: 'Shorten the label to three words or fewer, set white-space: nowrap and let the parent reflow,
    hide a non-essential item at narrow widths, or collapse the nav. Do not cap a CTA''s max-width to
    make it wrap.'
  source: slop gate 49
- id: SLP-50
  title: Image Grid Tracks Use minmax(0, 1fr)
  ask: Any grid track containing an image needs minmax(0, 1fr). Bare 1fr resolves to minmax(auto, 1fr),
    whose auto minimum is the image's intrinsic width - a 1024px image forces a 1024px minimum and blows
    past the phone viewport.
  probe: true
  kinds:
  - web-ui
  when: grid
  severity: blocker
  fix: 'One character per track: 1fr becomes minmax(0, 1fr).'
  source: slop gate 50
- id: SLP-51
  title: Display Headers Break Long Words
  ask: 'Every display-size element carries overflow-wrap: anywhere and min-width: 0. Long hyphenated words
    and uppercase compounds otherwise overflow the viewport.'
  probe: true
  kinds:
  - web-ui
  when: css
  severity: blocker
  fix: 'Add overflow-wrap: anywhere and min-width: 0 to the display rules.'
  source: slop gate 51
- id: SLP-52
  title: Theme Section-Head Overrides Collapse On Mobile
  ask: 'A theme that overrides .section__head grid-template-columns to anything but 1fr must also ship
    the mobile collapse, or a global override must exist at max-width: 48rem with matching specificity.
    Otherwise the title wraps onto the section label.'
  probe: false
  kinds:
  - web-ui
  when: css
  severity: required
  fix: Add the mobile collapse rule for the theme.
  source: slop gate 52
- id: SLP-53
  title: Radio-Tab Patterns Do Not Scroll-Jump
  ask: 'CSS-only radio tabs either keep the radios in normal flow at zero size with opacity 0, or ship
    a JS handler that preventDefaults, sets checked, dispatches change, and focuses with preventScroll.
    Absolutely-positioned radios at top: 0 jump the page on every tab click.'
  probe: false
  kinds:
  - web-ui
  when: tabs
  severity: required
  fix: Move the radios into flow at zero size, or add the JS guard.
  source: slop gate 53
- id: SLP-54
  title: Eyebrow Sits Above The Heading, Never Beside It
  ask: Any wrapper containing both an eyebrow, label, number, or kicker AND a heading must resolve to
    a single column - block, flex column, or a 1fr grid. Any multi-column grid on such a wrapper is banned,
    whatever the class name. Not bypassable by structural parity with a prior build; the gate is authoritative.
  probe: false
  kinds:
  - web-ui
  when: css
  severity: blocker
  fix: Flatten the wrapper to one column and stack the eyebrow above the heading.
  source: slop gate 54
- id: SLP-55
  title: All-Caps Display Type Has Line-Height At Least 1.0
  ask: Uppercase glyphs have no descenders, so at line-height under 1.0 the cap-tops of the next line
    collide with the baseline and commas of the one above. Floor is 1.0; 1.02-1.08 recommended.
  probe: false
  kinds:
  - web-ui
  - banner
  - social
  when: css
  severity: required
  fix: Raise the tight line-height token to at least 1.0, or drop the uppercase transform.
  source: slop gate 55
- id: SLP-56
  title: 'One Sticky Element At top: 0'
  ask: A second sticky-at-top-0 element below a sticky nav overlaps it during scroll and paints over it.
    Define --banner-height and offset every secondary sticky to it; split the z-index tokens so the nav
    always out-paints.
  probe: true
  kinds:
  - web-ui
  when: sticky
  severity: required
  fix: Offset secondary stickies to var(--banner-height) and raise the nav's z-index.
  source: slop gate 56
- id: SLP-57
  title: Studied DNA Is Not Discarded For A Catalog Theme
  ask: If a study diagnosis ran earlier in the conversation, the build's stamp names studied-DNA with
    its source, not a catalog theme - unless the user explicitly pivoted.
  probe: false
  kinds:
  - web-ui
  when: study
  severity: required
  fix: Re-emit using the studied DNA's tokens and update the stamp.
  source: slop gate 57
- id: TST-01
  title: Hero Headline Is Two Lines Or Fewer
  ask: 'The hero headline wraps to at most two lines at desktop. A four-line hero headline is a font-size
    error, never a copy-length error: the fix is a smaller display step planned against the asset beside
    it, or fewer words.'
  probe: true
  severity: blocker
  fix: Drop the hero display step, or cut the headline. Default range is text-4xl md:text-5xl lg:text-6xl;
    text-6xl md:text-7xl is for three to five words.
  source: references/marketing-surfaces.md#hero-fold
- id: TST-02
  title: Hero Subtext Caps At Twenty Words And Four Lines
  ask: Hero subtext runs to 20 words at most and 4 rendered lines at most. A value proposition that cannot
    be stated in 20 words is unclear rather than large.
  probe: true
  severity: blocker
  fix: Cut the subtext to one sentence that says what the product does for whom.
  source: references/marketing-surfaces.md#hero-fold
- id: TST-03
  title: Hero Top Padding Caps At Six Rem
  ask: Hero top padding stops at 6rem (pt-24) at desktop. Past that the content floats halfway down the
    viewport and reads as a layout bug rather than as space.
  probe: true
  fix: Reduce the hero's top padding to pt-24 or less. If it needs more presence, raise the font scale
    or the asset size instead.
  source: references/marketing-surfaces.md#hero-padding
- id: TST-04
  title: Hero Carries At Most Four Text Elements
  ask: 'The hero is one moment: an eyebrow or a brand strip but not both, a headline, a subtext, and the
    CTAs. The tagline under the buttons, the trust micro-strip, the pricing teaser, the feature bullets,
    and the avatar row all belong to sections below it.'
  probe: true
  severity: blocker
  fix: Move everything past the fourth text element out of the hero and into its own section.
  source: references/marketing-surfaces.md#hero-stack
- id: TST-05
  title: The Trust Strip Sits Below The Hero
  ask: A Used by / Trusted by / Backed by logo wall is a section directly under the hero, never a row
    inside it. The hero carries the value proposition and the primary action and nothing else.
  probe: true
  severity: blocker
  fix: Lift the logo wall out of the hero element into the section that follows it.
  source: references/marketing-surfaces.md#trust-strip
- id: TST-06
  title: No Version Or Status Label In The Hero
  ask: V0.6, v2.0, BETA, ALPHA, EARLY ACCESS, INVITE-ONLY PREVIEW as a hero eyebrow. Acceptable only when
    the brief is explicitly about launch or preview status.
  probe: true
  severity: blocker
  fix: Delete the label. If the launch status is the story, it belongs in the headline, not in an eyebrow
    above it.
  source: references/marketing-surfaces.md#version-label
- id: TST-07
  title: The Hero Carries A Real Visual
  ask: Text over a gradient blob is a placeholder, not a hero. A real photograph, a generated asset, a
    real product view, or a composition that is itself the visual.
  probe: false
  fix: Generate or source a hero image at the section's aspect ratio, or make the typography itself the
    composition rather than decorating it with a blur.
  source: references/marketing-surfaces.md#hero-visual
- id: TST-08
  title: One Eyebrow Per Three Sections
  ask: An eyebrow is the small uppercase wide-tracking label above a section headline. One above every
    section produces the same templated rhythm on every page. The cap is ceil(sectionCount / 3), hero
    included, and a section with an eyebrow is followed by two without.
  probe: true
  severity: blocker
  fix: Delete eyebrows until the count is within the cap. The headline alone is enough; the section's
    position on the page already says what it is.
  source: references/marketing-surfaces.md#eyebrow-density
- id: TST-09
  title: No Section-Number Eyebrow
  ask: 00 / INDEX, 001 · Capabilities, 06 · how it works, Phase 01, No. 02, and 01 / 4 pagination on tiles.
    An eyebrow names its topic in plain language or it does not exist.
  probe: true
  severity: blocker
  fix: Replace the number with the topic, or drop the label.
  source: references/marketing-surfaces.md#section-numbering
- id: TST-10
  title: No Generic Step Labels
  ask: Step 1 / Step 2, Stage 1 / Stage 2, Pass One / Pass Two, Phase 01 / Phase 02. The step content
    is the label; progression is carried by the verb.
  probe: true
  fix: 'Label each step with what it does: Install, Configure, Ship.'
  source: references/marketing-surfaces.md#step-labels
- id: TST-11
  title: At Most Two Consecutive Image-And-Text Splits
  ask: Alternating left-image-right-text with left-text-right-image is banal past two in a row. The third
    consecutive split fails, and breaks with a full-width section, a vertical stack, a bento grid, a marquee,
    or any other family.
  probe: true
  severity: blocker
  fix: Reshape the third section into a different layout family.
  source: references/marketing-surfaces.md#layout-repetition
- id: TST-12
  title: Four Layout Families Across Eight Sections
  ask: A layout family appears at most once per page, and a page of eight sections uses at least four
    distinct families. Selected commissions must not look like What we do.
  probe: true
  fix: 'Rebuild the repeated sections on different structures: a bento, a full-bleed statement, a horizontal
    scroll, a stacked editorial column.'
  source: references/marketing-surfaces.md#layout-repetition
- id: TST-13
  title: No Micro-Meta Sentence Under A Section Heading
  ask: An explanatory sentence under a section heading, of the shape 'Each of these is a feature we ship
    today, not a roadmap promise', is the builder talking about the work inside the product. Eyebrow,
    headline, body is enough.
  probe: false
  fix: Delete the sentence. If it carries real information, it belongs in the body copy.
  source: references/marketing-surfaces.md#micro-meta
- id: TST-14
  title: One Marquee Per Page
  ask: At most one horizontal marquee on a page. Two read as a template with a scrolling strip in every
    gap.
  probe: true
  fix: Keep the marquee that carries the most breadth and reshape the other into a grid or a static row.
  source: references/marketing-surfaces.md#marquee-count
- id: TST-15
  title: A Bento Grid Has Exactly As Many Cells As It Has Items
  ask: Three items is three cells, five items is five. An empty cell in the middle or at the end means
    the grid was shaped before the content was counted.
  probe: true
  severity: blocker
  fix: Reshape the grid to the item count, asymmetrically if needed. Do not paste a blank tile.
  source: references/marketing-surfaces.md#bento-cells
- id: TST-16
  title: Bento Cells Carry Visual Variation
  ask: At least two or three cells in a multi-cell grid hold a real image, a brand-appropriate gradient,
    a pattern, or a tinted surface. Six white-on-white cards with only type inside reads as a default
    even when the rest of the page is good.
  probe: false
  fix: Give two or three cells real visual content and let the rest carry the type.
  source: references/marketing-surfaces.md#bento-cells
- id: TST-17
  title: A List Past Five Items Changes Component
  ask: The default unordered list, or divide-y rows with a hairline under every one, is the laziest available
    layout for more than five items. Grouped columns, a card grid, tabs, scroll-snap pills, a carousel,
    or a marquee, chosen by what the items are.
  probe: true
  fix: 'Move the list to a component that suits its length: cluster it into three labelled groups, or
    give each item a card.'
  source: references/marketing-surfaces.md#long-lists
- id: TST-18
  title: No Hairline Under Every Row Of A Spec List
  ask: 'A ten-row spec list with a border under each row is the pattern that ships most and reads worst.
    One separator treatment, used sparsely: a bottom border between rows or a top border above the group,
    never both, and never on every row of a long list.'
  probe: true
  fix: Group the rows into two or three clusters with one soft divider each, or give each spec a card.
  source: references/marketing-surfaces.md#long-lists
- id: TST-19
  title: No Filled-Track Comparison Bars
  ask: Scoring or progress bars with a filled background track as a comparison visual import dashboard
    chrome onto a marketing page. A number with a small icon, or a thin inline bar with no track, carries
    the same information.
  probe: true
  fix: Replace the track-and-fill pair with a figure, or with a hairline bar that has no background track.
  source: references/marketing-surfaces.md#comparison-bars
- id: TST-20
  title: No Scroll Cue
  ask: Scroll, down-arrow scroll, Scroll to explore, Scroll to walk through it, animated mouse-wheel icons.
    A reader who has not scrolled yet is looking at the hero and knows what scrolling is.
  probe: true
  severity: blocker
  fix: Delete it. The bottom of the viewport does not need a label.
  source: references/marketing-surfaces.md#scroll-cues
- id: TST-21
  title: No Decoration Text Strip At The Hero Bottom
  ask: 'A mono-caps strip across the bottom of the hero: BRAND. MOTION. SPATIAL., TYPE / FORM / MOTION,
    ESTD. 2018 · LISBON. Acceptable only when the strip carries real navigation or real status.'
  probe: false
  fix: Delete the strip, or make its entries real links.
  source: references/marketing-surfaces.md#decoration-strips
- id: TST-22
  title: No Locale, Time, Or Weather Strip
  ask: Lisbon 14:23 · 18°C in the nav, an atmospheric address in the footer, a timezone clock in the header.
    A contact address is fine; a place-and-weather strip as mood is agency decoration. Allowed for a genuinely
    timezone-distributed studio, a travel brand, or a physical venue.
  probe: true
  fix: Delete the strip. Keep a real contact address in the footer if there is one.
  source: references/marketing-surfaces.md#decoration-strips
- id: TST-23
  title: The Middle Dot Is Rationed
  ask: 'One middle dot per line in a metadata strip. It is not the default separator for everything: foo
    · bar · baz · qux is a line that wanted columns, hairlines, or a break.'
  probe: true
  fix: Break the run into columns or lines, or drop to one separator.
  source: references/marketing-surfaces.md#separators
- id: TST-24
  title: Zero Decorative Status Dots
  ask: A coloured dot before a nav link, a list row, a badge, or a heading is decoration. It earns its
    place only by carrying real semantic state, and then it appears once per section at most.
  probe: true
  fix: Remove the dots. Keep one only where it reports a live state the reader acts on.
  source: references/marketing-surfaces.md#separators
- id: TST-25
  title: No Pill Or Label Overlaid On An Image
  ask: Brand · 02, PLATE · BRAND, Field notes - journal floating over a photograph. Either the image speaks
    alone or a caption sits below it, outside the frame.
  probe: true
  fix: Move the label below the image as a caption, or delete it.
  source: references/marketing-surfaces.md#image-labels
- id: TST-26
  title: No Photo-Credit Caption As Decoration
  ask: Field study no. 12 · Ines Caetano, Plate 03 · House archive, Frame XII · 35mm under stock or placeholder
    photography. Credit belongs to a real photographer of a real photograph.
  probe: true
  fix: Delete the caption, or replace it with one functional line about what the image shows.
  source: references/marketing-surfaces.md#image-labels
- id: TST-27
  title: No Version Footer On A Marketing Page
  ask: v1.4.2, Build 0048, last sync 4s ago · main in a marketing footer. Those are devtool fixtures.
    A live-stock counter is the same unless the number is real.
  probe: true
  fix: Delete it. A marketing footer names the entity and the year.
  source: references/marketing-surfaces.md#version-footer
- id: TST-28
  title: No Vertical Rotated Text As Decoration
  ask: INDEX OF WORK rotated ninety degrees down the side of a section. An agency-portfolio cliche that
    serves composition only when the brief is explicitly experimental.
  probe: true
  fix: Set the text horizontally, or remove it.
  source: references/marketing-surfaces.md#decoration-strips
- id: TST-29
  title: No Crosshair Or Hairline Grid As Decoration
  ask: Vertical and horizontal rules drawn across a section only to make the page feel designed. Lines
    organise real content or they come out.
  probe: false
  severity: advisory
  fix: Delete the lines, or align them to the columns the content actually uses.
  source: references/marketing-surfaces.md#decoration-strips
- id: TST-30
  title: No Custom Mouse Cursor
  ask: A replaced cursor is outdated, hostile to accessibility, and hostile to frame rate. This holds
    on every surface, not only marketing ones.
  probe: true
  when: css
  severity: blocker
  fix: Remove the custom cursor and restore the platform one.
  source: references/marketing-surfaces.md#custom-cursor
- id: TST-31
  title: One Accent Across The Whole Page
  ask: A warm-grey site does not get a blue CTA in section seven, and a rose-accented site does not get
    a teal badge in the footer. One accent, chosen once, used everywhere, with semantic state colours
    as the only exception.
  probe: true
  severity: blocker
  fix: Pick the accent and route every non-semantic use through the one token.
  source: references/marketing-surfaces.md#accent-lock
- id: TST-32
  title: The Page Holds One Theme
  ask: A light warm-paper section between dark sections tells the reader they walked into a different
    website. Tints within one family are fine; flipping families mid-scroll is broken. One deliberate
    colour-block switch is allowed when the brief asks for it.
  probe: true
  when: css
  severity: blocker
  fix: Move every section onto surfaces from the same theme family, or make the one switch a composed
    transition rather than an alternation.
  source: references/marketing-surfaces.md#theme-lock
- id: TST-33
  title: A Serif Is Justified, And Is Never Fraunces Or Instrument Serif
  ask: Serif is not the default for a creative brief. It is justified when the brief names one, or when
    the family is genuinely editorial, luxury, publication, manuscript, heritage, or vintage and the choice
    of that face can be argued for that brand. Fraunces and Instrument Serif are the two the model reaches
    for first and are banned outright as defaults.
  probe: true
  when: font
  severity: blocker
  fix: Move to a sans display face, or to a justified serif from a rotated pool, and record the reason
    this face fits this brand.
  source: references/marketing-surfaces.md#serif-discipline
- id: TST-34
  title: Emphasis Stays In One Family
  ask: Emphasising a word inside a headline uses italic or bold of the same face. A serif word injected
    into a sans headline, or the reverse, is mixed-family emphasis and reads as amateur.
  probe: false
  when: font
  fix: Set the emphasised word in the same family, in italic or a heavier weight.
  source: references/marketing-surfaces.md#serif-discipline
- id: TST-35
  title: Premium-Consumer Briefs Do Not Default To Beige And Brass
  ask: 'Warm cream backgrounds, brass or clay or oxblood accents, espresso near-black text: the palette
    every premium-consumer page reaches for, after which the brand is invisible. Allowed when the brief
    names those colours or the identity is genuinely warm-craft and the fit can be argued.'
  probe: true
  fix: 'Rotate to another family: cold luxury, forest, black and tan, cobalt and cream, terracotta and
    slate, olive and brick, or monochrome with one saturated accent.'
  source: references/marketing-surfaces.md#premium-consumer-palette
- id: TST-36
  title: No Neon Or Outer Glow
  ask: A saturated colour thrown wide behind an element as a glow. Depth comes from an inner border or
    a shadow tinted to the background hue, never a pure-black shadow on a light surface and never a coloured
    halo.
  probe: true
  when: css
  fix: Replace the glow with a 1px inner border or a tinted low-alpha shadow.
  source: references/marketing-surfaces.md#glow-and-gradient-text
- id: TST-37
  title: No Gradient Fill On Display Type
  ask: Clipping a gradient into a large headline is the most recognisable generated-page treatment there
    is, and it costs contrast at both ends of the ramp.
  probe: true
  when: css
  fix: Set the headline in one token colour and carry emphasis with weight.
  source: references/marketing-surfaces.md#glow-and-gradient-text
- id: TST-38
  title: Zero Em-Dashes In Any Visible String
  ask: Headlines, eyebrows, pills, button labels, body copy, quotes, attribution, captions, alt text,
    nav items. The en-dash used as a separator goes with it, and ranges take a hyphen. Binary because
    every softer phrasing of this has been ignored.
  probe: true
  when: copy
  severity: blocker
  fix: 'Restructure the sentence: a period, a comma, parentheses, or a colon. Ranges take a hyphen.'
  source: references/marketing-surfaces.md#em-dash
- id: TST-39
  title: One CTA Label Per Intent
  ask: Get in touch, Contact us, Let's talk, Start a project, Reach out are one intent and get one label,
    used in the nav, the hero, and the footer alike. The same holds for signup and for portfolio. Primary
    CTA copy is three words at most and never wraps.
  probe: true
  severity: blocker
  fix: Pick one label per intent and use it in every place that action appears.
  source: references/marketing-surfaces.md#cta-intent
- id: TST-40
  title: Section Copy Stays Within Its Density
  ask: 'Per section: a headline of eight words or fewer, a sub-paragraph of twenty-five words or fewer,
    and one visual or one CTA. Numbers are real, labelled as mock, or gone. One copy register for the
    page.'
  probe: true
  fix: Cut the headline to the claim and the paragraph to the reason. Move anything left over into its
    own section or off the page.
  source: references/marketing-surfaces.md#copy-density
- id: TST-41
  title: A Quote Is Three Lines With A Named Attribution
  ask: 'Quote body at most three lines: a landing-page quote is a snippet and a longer original gets cut.
    Attribution carries name and role, optionally company, never a bare first name. Real typographic quote
    marks or none.'
  probe: true
  fix: Cut the quote to its point and give the attribution a role beside the name.
  source: references/marketing-surfaces.md#quotes
- id: TST-42
  title: No Filler Verbs
  ask: Elevate, Seamless, Unleash, Next-Gen, Revolutionize, Supercharge, Effortless, Transformative. Concrete
    verbs say what the product does; these say that someone wanted a sentence there.
  probe: true
  when: copy
  fix: Replace with the verb that names the action the product actually performs.
  source: references/marketing-surfaces.md#copy-density
- id: TST-43
  title: Typographic Quote Marks, Not ASCII
  ask: Quoted copy uses real curly quotes or none at all. Straight ASCII quotes in set copy are a typing
    artefact showing through the design.
  probe: true
  severity: advisory
  fix: Replace the ASCII quotes with typographic ones, or drop the marks and carry the quote with layout.
  source: references/marketing-surfaces.md#quotes
- id: TST-44
  title: The Page Carries Real Images
  ask: A pure-text page is incomplete work, not minimalism. Even a restrained editorial page needs a hero
    visual and two or three supporting images. Generated first, then real photography with a descriptive
    seed, then labelled placeholder slots handed back with the work.
  probe: true
  fix: Generate the section assets, or source them, or leave labelled slots and say in the handover exactly
    which placements need a real image.
  source: references/marketing-surfaces.md#imagery
- id: TST-45
  title: Placeholder Photography Resolves
  ask: A bare source.unsplash.com URL is a broken image waiting to happen, and via.placeholder.com is
    a grey rectangle with a size written on it. Seeded picsum, a real asset, or a generated file.
  probe: true
  fix: Move to https://picsum.photos/seed/{descriptive-seed}/{w}/{h} with a seed naming the section, or
    to a real asset.
  source: references/marketing-surfaces.md#imagery
- id: TST-46
  title: A Logo Wall Uses Real Marks
  ask: Styled text wordmarks in a row read as placeholder. Simple Icons for known brands, devicon for
    stacks, a generated monogram for an invented one, and every mark legible in both themes.
  probe: true
  fix: Replace the text with real marks from https://cdn.simpleicons.org/{slug}/{hex}, or draw a simple
    monogram for an invented brand.
  source: references/marketing-surfaces.md#logo-walls
- id: TST-47
  title: A Logo Wall Carries Logos And Nothing Else
  ask: 'No industry or category label under each mark: not Vercel over hosting, not Stripe over payments.
    The logo is the credibility and the label adds nothing the reader does not already have. Brand name
    as alt text, optionally a link.'
  probe: true
  fix: Delete the category labels and let the marks stand.
  source: references/marketing-surfaces.md#logo-walls
- id: TST-48
  title: No Hand-Rolled Decorative SVG
  ask: Custom illustrations and decorative marks drawn as path data. Icons come from one library, and
    a missing glyph means a second library or a composition from primitives. A simple geometric mark or
    an explicitly requested drawing is the exception.
  probe: true
  fix: Replace the drawing with a real image, a library glyph, or a simple geometric mark.
  source: references/marketing-surfaces.md#imagery
- id: TST-49
  title: No Scroll Listener
  ask: window.addEventListener('scroll') runs on every scroll frame, batches nothing, and janks. Motion's
    useScroll, GSAP's ScrollTrigger, IntersectionObserver, or CSS animation-timeline instead.
  probe: true
  when: html
  severity: blocker
  fix: 'Move to useScroll(), ScrollTrigger, IntersectionObserver, or animation-timeline: view().'
  source: references/marketing-surfaces.md#scroll-and-state
- id: TST-50
  title: Continuous Input Values Are Not React State
  ask: Pointer position, scroll progress, and magnetic hover physics held in useState re-render the tree
    on every frame and collapse on mobile. Motion values carry them instead.
  probe: true
  when: react
  severity: blocker
  fix: Replace the state with useMotionValue / useTransform, or a ref the animation reads directly.
  source: references/marketing-surfaces.md#scroll-and-state
- id: TST-51
  title: Animation Frame Loops Do Not Set State
  ask: 'A requestAnimationFrame loop that calls a setter is the same defect as a scroll listener in React
    state: a render per frame for a value nothing else reads.'
  probe: true
  when: react
  fix: Write the value to a motion value or a ref inside the loop and let the animation read it.
  source: references/marketing-surfaces.md#scroll-and-state
- id: TST-52
  title: Animation Effects Clean Up
  ask: An effect that starts a listener, a timer, an observer, or an animation frame returns the function
    that stops it. Without it the loop outlives the component and the count climbs on every route change.
  probe: true
  when: react
  fix: Return a cleanup from the effect that removes the listener, clears the timer, disconnects the observer,
    or cancels the frame.
  source: references/marketing-surfaces.md#scroll-and-state
- id: TST-53
  title: Motion Lives In A Client Leaf
  ask: A component using motion, scroll position, or pointer physics is an isolated leaf carrying its
    own client directive. Smearing it across a server tree pulls the whole branch onto the client for
    one animated element.
  probe: true
  fix: Add the client directive at the top of the animated leaf, and keep its parents as server components.
  source: references/marketing-surfaces.md#scroll-and-state
- id: TST-54
  title: Grain Is Fixed And Inert
  ask: Grain and noise overlays sit on a fixed, pointer-events-none layer. On a scrolling container they
    repaint continuously and take the frame rate with them on mobile.
  probe: true
  when: css
  fix: Move the grain to a fixed inset-0 pointer-events-none pseudo-element on its own layer.
  source: references/marketing-surfaces.md#page-mechanics
- id: TST-55
  title: Grid, Not Flex Percentage Math
  ask: A width computed as a percentage minus a gap is a grid written the long way, and it breaks at every
    breakpoint the arithmetic did not anticipate.
  probe: true
  when: css
  fix: 'Replace with a grid: grid grid-cols-1 md:grid-cols-3 gap-6.'
  source: references/marketing-surfaces.md#page-mechanics
- id: TST-56
  title: Fonts Are Not A Google Fonts Link
  ask: A stylesheet link to a third-party font host blocks render on a domain the page does not control.
    Self-hosted files or the framework's font pipeline.
  probe: true
  when: font
  fix: 'Self-host the files with font-display: swap, or load them through next/font.'
  source: references/marketing-surfaces.md#page-mechanics
- id: TST-57
  title: Every Import Is In package.json
  ask: An import of a package the manifest does not carry is the most common way a generated page fails
    to build at all, and it fails at install time rather than in review.
  probe: true
  when: web-build
  severity: blocker
  fix: Install the package, or import from one the project already has.
  source: references/marketing-surfaces.md#dependencies
- id: TST-58
  title: One Design System Per Project
  ask: Material beside shadcn, Carbon beside Radix Themes, Bootstrap beside Tailwind utilities. Two systems
    in one tree argue about tokens, radius, and control height, and the interface loses.
  probe: true
  when: web-build
  fix: Choose one system and remove the other's dependency and imports.
  source: references/marketing-surfaces.md#dependencies
- id: TST-59
  title: System Components Are Not Left In Their Default State
  ask: A component library shipped unmodified is the library's design, not the project's. Radius, colour,
    shadow, control height, and type are brought onto the project's tokens.
  probe: false
  when: react
  fix: Bring the library's theme onto the project's tokens and record which values were changed.
  source: references/marketing-surfaces.md#dependencies
- id: TST-60
  title: The Navigation Renders On One Line
  ask: Items that do not fit at 1024px get shorter labels, fewer secondary entries, or a disclosure. A
    two-line nav at desktop is broken.
  probe: true
  severity: blocker
  fix: Shorten the labels, drop the secondary items into a menu, or move the whole bar to a disclosure
    at that width.
  source: references/marketing-surfaces.md#nav-shape
- id: TST-61
  title: Navigation Height Caps At Eighty Pixels
  ask: The bar sits at 64 to 72 pixels by default and stops at 80. A bar eating a sixth of the viewport
    is a habit rather than a decision.
  probe: true
  fix: Reduce the bar's vertical padding until it measures 80px or less.
  source: references/marketing-surfaces.md#nav-shape
- id: TST-62
  title: The Design Read Is Recorded Before The Work
  ask: Page kind, audience, the vibe words the brief used, the references it named, the brand assets that
    already exist, and any constraint that outranks aesthetics. The audience picks the aesthetic; a run
    that skips this step reaches for a default one instead.
  probe: true
  kinds:
  - web-ui
  - slides
  severity: blocker
  fix: design-pass.py read --page-kind <landing|portfolio|editorial|product> --audience <who> --vibe <words>
    --constraint <what outranks taste>
  source: references/marketing-surfaces.md#design-read
- id: TST-63
  title: The Direction Differs From The Last Run Of Its Genre
  ask: Two premium-consumer pages in a row do not share a palette family, and two editorial pages do not
    share a serif. The reflex is invisible from inside one project and obvious across three.
  probe: true
  kinds:
  - web-ui
  - slides
  fix: Change the palette family or the display face, then record the new direction on the run's design
    read.
  source: references/marketing-surfaces.md#rotation
- id: UXA-01
  title: Alt Text On Meaningful Images
  ask: Every image that carries meaning has descriptive alt text; decorative images have empty alt.
  probe: true
  when: image
  severity: blocker
- id: UXA-02
  title: Icon-Only Buttons Have Accessible Names
  ask: aria-label on icon-only buttons, accessibilityLabel in native. An unlabelled icon button is invisible
    to a screen reader.
  probe: true
  when: interactive
  severity: blocker
- id: UXA-03
  title: Tab Order Matches Visual Order
  ask: Full keyboard operation, and the tab sequence follows the reading order. No positive tabindex.
  probe: false
  when: interactive
  severity: blocker
- id: UXA-04
  title: Form Labels Are Real Labels
  ask: Every field has a visible label element bound with for. Placeholder-only labelling fails as soon
    as the field has content.
  probe: true
  when: form
  severity: blocker
- id: UXA-05
  title: Skip Link To Main Content
  ask: A keyboard user can jump past the navigation to the main content.
  probe: false
  when: nav
  severity: required
- id: UXA-06
  title: Heading Hierarchy Is Sequential
  ask: h1 through h6 in order, no skipped level, one h1 per page.
  probe: true
  when: html
  severity: required
- id: UXA-07
  title: Colour Is Never The Only Signal
  ask: Error, success, selected, and required states carry an icon, shape, or word alongside the colour.
  probe: false
  when: html
  severity: blocker
- id: UXA-08
  title: Text Scaling Does Not Break Layout
  ask: The layout survives system text scaling and Dynamic Type at its largest setting without truncation
    or overlap.
  probe: false
  when: css
- id: UXA-09
  title: Screen Reader Order And Roles Are Right
  ask: Reading order is logical, roles and states (selected, disabled, expanded) are announced, and hints
    are meaningful.
  probe: false
  when: interactive
  severity: blocker
- id: UXA-10
  title: Modals And Multi-Step Flows Have An Escape
  ask: A visible cancel or back route out of every modal and every step of a flow, plus Escape on desktop.
  probe: false
  when: modal
  severity: blocker
- id: UXA-11
  title: System And Accessibility Shortcuts Preserved
  ask: Nothing overrides system or assistive shortcuts, and drag-and-drop has a keyboard alternative.
  probe: false
  when: interactive
- id: UXA-12
  title: Focus Moves To Main On Route Change
  ask: After a page transition, focus lands on the main content region so screen reader users are not
    stranded at the top.
  probe: false
  when: router
- id: UXT-01
  title: 8px Between Touch Targets
  ask: Neighbouring targets keep at least 8px of separation so a near-miss does not fire the wrong control.
  probe: false
  when: interactive
- id: UXT-02
  title: Primary Actions Do Not Depend On Hover
  ask: Anything essential is reachable by click or tap. Hover-only affordances do not exist on touch.
  probe: false
  when: interactive
  severity: blocker
- id: UXT-03
  title: Errors Appear Next To Their Cause
  ask: The error message sits by the thing that caused it, in plain words, with the way out.
  probe: false
  when: form
  severity: blocker
- id: UXT-04
  title: No Horizontal Swipe On Main Content
  ask: Main content scrolls vertically. Horizontal swipe is reserved for carousels and back gestures,
    and never fights them.
  probe: false
  when: interactive
- id: UXT-05
  title: Platform Gestures Behave As Expected
  ask: Swipe-back, pinch-zoom, and pull-to-refresh keep their standard meanings, and system gestures are
    not blocked.
  probe: false
  when: mobile
- id: UXT-06
  title: Gestures Have A Visible Alternative
  ask: Nothing critical is gesture-only. Swipe actions show an affordance - a chevron, a label, a peek.
  probe: false
  when: mobile
  severity: blocker
- id: UXT-07
  title: Safe Areas Are Respected
  ask: Primary targets stay clear of the notch, Dynamic Island, gesture bar, and screen edges.
  probe: false
  when: mobile
  severity: blocker
- id: UXT-08
  title: No Pixel-Perfect Precision Required
  ask: No tap depends on hitting a small icon or a thin edge exactly.
  probe: false
  when: interactive
- id: UXT-09
  title: Haptics Are Used Sparingly
  ask: Haptic feedback confirms important actions and nothing else.
  probe: false
  when: mobile
  severity: advisory
- id: UXP-01
  title: Images Are Optimised And Responsive
  ask: WebP or AVIF, srcset and sizes for the widths in play, lazy loading below the fold, eager and fetchpriority
    high on the LCP image.
  probe: true
  when: image
  severity: required
- id: UXP-02
  title: Images Declare Their Box
  ask: width and height attributes or an aspect-ratio, so nothing shifts as they load.
  probe: true
  when: image
  severity: blocker
- id: UXP-03
  title: Fonts Load Without Blanking Text
  ask: 'font-display: swap or optional, space reserved to limit shift, and only genuinely critical faces
    preloaded.'
  probe: true
  when: font
  severity: required
- id: UXP-04
  title: Above-The-Fold CSS Is Prioritised
  ask: Critical CSS is inline or loaded first; the rest does not block the first paint.
  probe: false
  when: web-build
  severity: advisory
- id: UXP-05
  title: Non-Critical Code Is Split Out
  ask: Route-level or feature-level splitting, dynamic import for anything below the fold or behind an
    interaction.
  probe: false
  when: web-build
  severity: advisory
- id: UXP-06
  title: Third-Party Scripts Are Async And Audited
  ask: Every third-party tag is async or defer, and every one still on the page has a reason to be.
  probe: false
  when: web-build
- id: UXP-07
  title: Async Content Reserves Its Space
  ask: Space is held for content that arrives late, so nothing below it jumps.
  probe: false
  when: fetch
  severity: blocker
- id: UXP-08
  title: Long Lists Are Virtualised
  ask: Past roughly 50 items, the list virtualises rather than rendering everything.
  probe: false
  when: list
- id: UXP-09
  title: Frame Budget Is Respected
  ask: Per-frame work stays under 16ms; heavy work moves off the main thread. High-frequency events are
    debounced or throttled.
  probe: false
  when: motion
- id: UXP-10
  title: Offline And Slow Networks Degrade Gracefully
  ask: An offline state says so, and slow connections get lower-resolution images and less motion rather
    than a hang.
  probe: false
