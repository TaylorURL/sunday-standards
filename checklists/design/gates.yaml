- id: UXV-03
  title: Nav Items Carry Icon And Label
  ask: Icon-only navigation costs discoverability. Bottom navigation caps at five items.
  probe: false
  when: nav
- id: UXV-04
  title: Primary And Secondary Nav Are Separated
  ask: Tabs or bottom bar for top-level; drawer or settings for secondary. Not mixed at the same level.
  probe: false
