  probe: false
  when: chart
- id: UXD-07
  title: Charts Reflow On Small Screens
  ask: Horizontal bars instead of vertical, fewer ticks, simplified series - not a squeezed desktop chart.
  probe: false
  when: chart
  severity: blocker
- id: UXD-08
  title: Empty, Loading, And Failed Chart States
  ask: No-data says so with guidance, loading shows a shaped skeleton rather than a bare axis frame, and
    a failure offers retry.
  probe: false
  when: chart
  severity: blocker
- id: UXD-09
  title: Chart Contrast Meets Threshold
  ask: Data marks clear 3:1 against the background; data labels clear 4.5:1. Gridlines stay low-contrast
    so they do not compete.
  probe: false
  when: chart
  severity: blocker
- id: UXD-10
  title: Chart Interactivity Is Keyboard-Reachable
  ask: Points, bars, and slices are focusable, with a text summary naming the chart's key insight.
  probe: false
  when: chart
- id: UXD-11
  title: Large Datasets Aggregate
  ask: Past a thousand points, aggregate or sample and offer drill-down rather than rendering everything.
  probe: false
  when: chart
- id: UXD-12
  title: Numbers Are Locale-Formatted
  ask: Numbers, dates, and currencies formatted for the locale on axes and labels.
  probe: false
  when: chart
- id: UXD-13
  title: Data Over Decoration
  ask: No heavy gradients or shadows on data marks. Density is capped; split rather than cram.
  probe: false
  when: chart
- id: UXD-14
  title: Chart Touch Targets Clear 44pt
  ask: Interactive points and segments have a 44pt tap area or expand on touch.
  probe: false
  when: chart
- id: UXR-01
  title: Sortable Tables Announce Their Sort
  ask: aria-sort reflects the current column and direction.
  probe: false
  when: table
- id: UXR-02
  title: Tables Have A Small-Screen Answer
  ask: A table on a phone stacks, scrolls inside its own container, or drops to the columns that matter
    - it does not overflow the page.
  probe: false
  when: table
  severity: blocker
- id: UXF-24
  title: Action Feedback Is A Transient Toast, Bottom Right
  ask: 'The outcome of an action the visitor just took - a sign-in refused, an account made, something
    added to a cart, a record saved - is reported by a transient toast in the bottom-right corner, raised
    through one shared host and gone on its own. Not an inline banner pushed into the page: a coloured
    strip above a form moves every field below it the instant it appears, stays until some other code
    clears it, and reads as part of the page rather than as an answer to the click. Not a per-page one-off
    either, because that is how one product ends up with a green bar at the top of one route, a red panel
    inline on another, and no two of them behaving alike. One host, one corner, one lifetime.'
  probe: true
  when: components
  severity: required
  fix: Put one toast host in the shell and raise everything through it. Anchor it bottom right, give each
    toast a lifetime that clears it without being touched, and use the assertive live region for failures
    and the polite one for successes. Delete the inline banners and the per-page fixed one-offs as you
    go; leaving one behind is what the gate counts.
- id: KBD-01
  title: An App Surface Has A Keyboard
  ask: A surface a person works in rather than reads through binds keyboard shortcuts. The two that nearly
    always earn one are a search or command palette reaching every destination the product has, on the
    modifier every other application uses for it, and a toggle for the navigation rail, on the modifier
    every other application uses for that. A surface with no keyboard at all is one where every action
    costs a trip to the pointer, including the ones taken forty times an hour.
  probe: true
  fix: Bind a small set of shortcuts. Start with the search palette and the navigation toggle, both on
    the platform modifier, and add a third only where it clears the same bar.
- id: KBD-02
  title: The Set Is Three Keys Or Fewer
  ask: 'Three shortcuts across the whole surface, and a fourth has to be argued for. The failure this
    catches is the shortcut list written for its own sake: a digit per filter, a letter per section, a
    chord per panel, none of which is remembered and all of which have to be documented. Anything already
    sitting on screen as a control does not get a key as well.'
  probe: true
  severity: blocker
  fix: Delete every shortcut standing in for a control the reader can already see, and keep the ones that
    change where they are or what the screen looks like.
- id: KBD-03
  title: The Keyboard Says What It Is
  ask: A modified shortcut is invisible until something states it, so the surface carries a list a reader
    can open and a visible way to open it. The list is itself the third shortcut worth having, on `?`.
    A set of keys with nothing that enumerates them is a set only its author knows.
  probe: true
  fix: Add a shortcut list opened by `?` and by a visible control, and print the key on the control it
    belongs to where there is room for it.
- id: KBD-04
  title: The Modifier Is The One The Reader Has
  ask: Where a key is drawn on screen it is drawn as the key that reader's own keyboard carries. A Mac
    shown Ctrl and a PC shown Command are each being told to press something they do not have, which is
    worse than printing nothing.
  probe: true
  fix: Pick the glyph from the platform once, and render that everywhere a key is drawn.
- id: MRK-01
  title: Marks Are Normalised On The Way In, Not Filtered On The Way Out
  ask: 'A borrowed mark is taken once, lifted off any ground it was baked onto, trimmed to its own bounds,
    centred, and stored at one size with an alpha channel - so every mark in the set is the same shape
    of file at the same optical weight. A filter applied at render time cannot do this: it sees a finished
    bitmap and knows nothing about what is artwork and what is the square behind it, which is why every
    global treatment is wrong for some of the set.'
  probe: true
  fix: Normalise the set off the render path - trim, centre, one size, alpha - and leave the colours alone.
- id: MRK-02
  title: A Mark Keeps Its Colour
  ask: The mark is drawn in its own colours at rest, not only on hover. Colour is the fastest thing a
    reader identifies a brand by at the sizes these are shown at, and a treatment that holds it back until
    the pointer arrives has made the list unreadable in exchange for making it quiet. Where a set still
    reads as loud after normalising, the answer is smaller marks or more space around them, never less
    colour.
  probe: true
  fix: Draw them in colour. If the column reads as busy, take size or add spacing.
- id: MRK-03
  title: The Ground Is Decided Per Mark
  ask: Artwork drawn in pale ink is invisible on pale paper and dark artwork disappears on a dark slab,
    and neither is a fault the mark can fix. So the tile's ground is chosen for each mark from its own
    artwork - measured, at the point it is taken in, over the pixels that are actually visible rather
    than over the transparent field around them - and recorded beside it. One ground applied to the whole
    set is the rule that loses whichever marks it does not suit.
  probe: true
  fix: Measure each mark's luminance over its visible pixels when it is captured, store the ground it
    needs, and render the tile from that. Give the tile one size, one radius, a hairline and an inset
    so nothing touches an edge.
- id: MRK-04
  title: The Treatment Is Held In One Place
  ask: 'Every surface showing the same mark shows it the same way, from one component, so a switcher,
    a table and a search result cannot drift into three treatments. The first-party mark is held to this
    too: a product that draws every client''s logo and falls back to a letter for its own is the one oversight
    every reader notices.'
  probe: false
  fix: One component, one tile, one source of grounds. Give the first-party domains their own committed
    mark rather than letting them fall through to the fallback.
- id: SYS-01
  title: Three Token Layers
  ask: Primitive holds raw values, semantic aliases them by purpose, component tokens reference semantic.
    A component reaching straight for a primitive skips the layer that makes theming possible.
  probe: false
  when: tokens
  severity: blocker
- id: SYS-02
  title: Semantic Names Describe Purpose, Not Appearance
  ask: --color-primary, --color-danger, --color-surface. Not --color-blue-600 in a component, and not
    --color-light-grey for a border that turns dark in another theme.
  probe: false
  when: tokens
  severity: blocker
- id: SYS-03
  title: Spacing Scale Is 4px-Based
  ask: One scale, multiples of 4, named steps. Every padding, gap, and margin lands on it.
  probe: true
  when: css
- id: SYS-04
  title: Type Scale Is Defined And Used
  ask: A named size scale with matching line-heights, referenced rather than restated per component.
  probe: false
  when: css
- id: SYS-05
  title: Radius, Shadow, And Border Are Tokens
  ask: Corner radius, elevation, and border width come from named steps, so a change to the style language
    is one edit.
  probe: false
  when: css
- id: SYS-06
  title: Z-Index Layers Are Named
  ask: base, dropdown, sticky, sticky-nav, overlay, modal, toast - each with a value, and the nav above
    in-page stickies.
  probe: true
  when: css
- id: SYS-07
  title: Motion Tokens Are Named
  ask: Durations and easing curves are tokens, so the whole interface shares one rhythm.
  probe: false
  when: motion
- id: SYS-08
  title: Every Token Resolves In All Three Themes
  ask: No token defined for light only. Dark and gray each carry the full set; a missing entry inherits
    a colour that does not belong there.
  probe: false
  when: tokens
  severity: blocker
- id: SYS-09
  title: Component States Are Specified
  ask: Each component names its default, hover, focus, active, disabled, loading, error, and empty states,
    with the token for each.
  probe: false
  when: component
- id: SYS-10
  title: Tokens Validate Clean
  ask: 'The token validator runs over the source and reports no unreferenced literals: node scripts/system/validate-tokens.cjs
    --dir <src>.'
  probe: false
  when: tokens
- id: SYS-11
  title: Tailwind Theme Mirrors The Tokens
  ask: Where Tailwind is in play, its theme extends from the same token source rather than carrying a
    second, divergent palette.
  probe: false
  when: tailwind
- id: BRD-01
  title: Correct Logo Variant For Its Background
  ask: The variant that suits the surface it sits on - full colour, mono, or reversed - never the light
    logo dropped on a light background.
  probe: false
  when: brand_asset
  severity: blocker
- id: BRD-02
  title: Clear Space Maintained
  ask: The logo's defined clear space is empty on all four sides.
  probe: false
  when: brand_asset
- id: BRD-03
  title: Minimum Size Respected
  ask: The logo is not used below its stated minimum, and is legible at the size it actually renders.
  probe: false
  when: brand_asset
  severity: blocker
- id: BRD-04
  title: No Unauthorised Logo Modification
  ask: No recolouring, no stretching, no re-proportioning, no effects added.
  probe: false
  when: brand_asset
  severity: blocker
- id: BRD-05
  title: Brand Palette Only
  ask: No colour outside the brand palette, with the primary/secondary/accent ratio roughly 60/30/10.
  probe: false
  when: brand_asset
  severity: blocker
- id: BRD-06
  title: Brand Fonts, Correct Weights
  ask: The brand's faces at the weights the guidelines name, with the hierarchy the guidelines set.
  probe: false
  when: brand_asset
  severity: blocker
- id: BRD-07
  title: Imagery Matches The Brand Style
  ask: Subject, treatment, and editing match the established photographic style, and everything used is
    licensed.
  probe: false
  when: image
- id: BRD-08
  title: Voice Matches The Brand
  ask: Tone matches the brand personality and the context, terminology and capitalisation follow the style
    guide, and no prohibited term appears.
  probe: false
  when: copy
  severity: blocker
- id: BRD-09
  title: Message Aligns To The Framework
  ask: The value proposition is clear, differentiators are present, benefits lead over features, and nothing
    contradicts the messaging framework.
  probe: false
  when: copy
- id: BRD-10
  title: No Orphans Or Widows In Set Copy
  ask: No single word stranded on its own line at the end of a paragraph or headline in fixed-layout output.
  probe: false
  when: print
- id: BRD-11
  title: Claims Are Supportable
  ask: No misleading claim, no unsourced superlative, pricing accurate, required disclosures present.
  probe: false
  when: copy
  severity: blocker
- id: BRD-12
  title: Third-Party Material Is Cleared
  ask: Stock imagery licensed, audio cleared, no trademark used without right, credits present where required.
  probe: false
  when: brand_asset
  severity: blocker
- id: AST-01
  title: Logo Ships With A Transparent Background
  ask: The delivered logo has an alpha channel and its corners are actually transparent. A mark generated
    on white is a mark that shows a white box on every surface that is not white. Generation on white
    is a prompt technique, not a deliverable - the background comes off before hand-off.
  probe: true
  kinds:
  - logo
  - icon
  - cip
  when: png_export
  severity: blocker
  fix: Run scripts/logo/transparent.py on the export, then re-verify. Deliver the transparent file; keep
    the white-background render only as a preview.
  source: references/logo-design.md; SKILL.md#logo
- id: AST-02
  title: Logo Ships In Vector Where It Can
  ask: An SVG accompanies the raster wherever the mark is vectorisable. A logo that only exists as a PNG
    cannot go on a vehicle or a sign.
  probe: false
  kinds:
  - logo
  - icon
  when: asset_export
  severity: required
  source: references/logo-style-guide.md
- id: AST-03
  title: Logo Legible At Minimum Size
  ask: Rendered at 16px, 32px, and its stated minimum, the mark still reads. Detail that disappears at
    favicon size is detail the mark does not need.
  probe: false
  kinds:
  - logo
  - icon
  when: asset_export
  severity: blocker
  source: references/logo-design.md
- id: AST-04
  title: Light And Dark Variants Delivered
  ask: A variant that reads on a light surface and one that reads on a dark surface. One file is half
    a delivery.
  probe: false
  kinds:
  - logo
  - icon
  when: asset_export
  severity: required
  source: references/logo-style-guide.md
- id: AST-05
  title: Icons Are SVG With A Consistent Grid
  ask: One viewBox, one stroke width, one visual weight across the set. Icons sit on the same optical
    grid so they do not jitter in a row.
  probe: false
  kinds:
  - icon
  when: asset_export
  severity: required
  source: references/icon-design.md
- id: AST-06
  title: Icons Inherit Colour
  ask: Icons use currentColor rather than a baked fill, so they follow the three themes rather than fighting
    them.
  probe: true
  kinds:
  - icon
  when: svg_export
  severity: blocker
  fix: Replace hardcoded fill and stroke values with currentColor.
  source: references/icon-design.md
- id: AST-07
  title: Exported At The Exact Platform Size
  ask: The file's pixel dimensions match the platform specification exactly - not close, exactly. A cover
    image one pixel off gets recompressed and softened.
  probe: true
  kinds:
  - banner
  - social
  when: png_export
  severity: blocker
  fix: Re-export at the specified dimensions.
  source: references/banner-sizes-and-styles.md
- id: AST-08
  title: Critical Content Inside The Safe Zone
  ask: Everything that must be read sits in the central 70-80%. Platform chrome, avatars, and crops eat
    the edges.
  probe: false
  kinds:
  - banner
  - social
  when: asset_export
  severity: blocker
  source: references/banner-sizes-and-styles.md
- id: AST-09
  title: One CTA, Placed And Sized
  ask: A single call to action, bottom-right, at least 44px tall.
  probe: false
  kinds:
  - banner
  when: asset_export
  severity: required
  source: references/banner-sizes-and-styles.md
- id: AST-10
  title: Two Fonts, Body 16px+, Headline 32px+
  ask: At most two faces on a banner; body no smaller than 16px; headline no smaller than 32px.
  probe: false
  kinds:
  - banner
  - social
  when: asset_export
  severity: required
  source: references/banner-sizes-and-styles.md
- id: AST-11
  title: Ad Text Under 20% Of The Image
  ask: Meta penalises reach past roughly 20% text coverage. Measured, not estimated.
  probe: false
  kinds:
  - banner
  when: ad
  severity: required
  source: references/banner-sizes-and-styles.md
- id: AST-12
  title: Print Output Is 300 DPI, CMYK, With Bleed
  ask: 300 DPI, CMYK colour, 3-5mm bleed on every edge that runs off the page.
  probe: false
  kinds:
  - banner
  - cip
  when: print
  severity: blocker
  source: references/banner-sizes-and-styles.md; references/cip-design.md
- id: AST-13
  title: Every Requested Size Was Produced
  ask: Each platform and size the brief named exists as a file. A set delivered short is a set the user
    has to chase.
  probe: false
  kinds:
  - banner
  - social
  - icon
  when: asset_export
  severity: blocker
  source: references/social-photos-design.md
- id: AST-14
  title: Exports Are Named And Optimised
  ask: Consistent, sortable filenames that say platform and size; file sizes optimised for the medium;
    email assets under 1MB.
  probe: false
  kinds:
  - banner
  - social
  - logo
  - icon
  - cip
  when: asset_export
  severity: required
  source: references/brand/approval-checklist.md
- id: AST-15
  title: Every Export Was Looked At
  ask: Each exported file was opened at full size and inspected - not assumed correct because the HTML
    looked right. Text baked into an image cannot be fixed later.
  probe: false
  kinds:
  - banner
  - social
  - logo
  - icon
  - cip
  when: asset_export
  severity: blocker
  source: references/social-photos-design.md
- id: AST-16
  title: CIP Deliverables Cover The Named Set
  ask: Each deliverable the brief asked for exists, with the logo placed to its usage rules on every one.
  probe: false
  kinds:
  - cip
  when: asset_export
  severity: blocker
  source: references/cip-deliverable-guide.md
- id: SLD-01
  title: One Idea Per Slide
  ask: Each slide carries a single point. A slide with three arguments is three slides.
  probe: false
  when: always
  severity: blocker
- id: SLD-02
  title: Headline States The Takeaway
  ask: The headline says the conclusion, not the topic. 'Revenue doubled in Q3', not 'Q3 Revenue'.
  probe: false
  when: copy
  severity: blocker
- id: SLD-03
  title: Layout Comes From The Pattern Library
  ask: The slide uses a layout from references/slides-layout-patterns.md, chosen for its content shape
    rather than defaulting to title-and-bullets throughout.
  probe: false
  when: always
- id: SLD-04
  title: Deck Rhythm Varies
  ask: Consecutive slides do not share a layout. A deck of identical slides reads as a template.
  probe: false
  when: always
- id: SLD-05
  title: Chart Type Matches The Claim
  ask: The chart supports the headline's claim, and its type matches the data shape. Chart.js defaults
    are overridden to the deck's tokens.
  probe: false
  when: chart
  severity: blocker
- id: SLD-06
  title: Every Figure Is Real
  ask: No number on a slide the user did not supply. A placeholder is marked as one.
  probe: true
  when: copy
  severity: blocker
- id: SLD-07
  title: Readable At Presentation Size
  ask: Body type reads from the back of a room - nothing under 18px at 1920x1080, and no text sitting
    outside the safe margin.
  probe: false
  when: always
  severity: blocker
- id: SLD-08
  title: Deck Uses Design Tokens
  ask: 'Colour, type, and spacing come from the deck''s token block, so every slide agrees. The validator
    runs clean: python3 scripts/system/slide-token-validator.py.'
  probe: false
  when: css
  severity: blocker
- id: SLD-09
  title: Copy Follows The Formulas
  ask: Headlines, transitions, and closers are built with the formulas in references/slides-copywriting-formulas.md,
    then held to avoid-ai-writing.
  probe: false
  when: copy
  severity: blocker
- id: SLD-10
  title: Speaker Notes Carry What The Slide Does Not
  ask: The detail that would clutter the slide lives in the notes, and the notes go through the copy pass
    too.
  probe: false
  when: copy
- id: SLD-11
  title: Deck Renders At 16:9 And Prints
  ask: Checked at presentation size and in print or PDF export, since a deck usually travels as both.
  probe: false
  when: always
  severity: blocker
